<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forms, Documents &amp; E-Signatures · Kupes Hair Williamsburg</title>
<link rel="stylesheet" href="/css/theme.css">
<link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="stylesheet" href="/css/portal-theme.css">
</head>
<body>
<script src="/js/app.js"></script>
<script>
Auth.requireAdmin();
// Three formerly-separate pages (Form Builder, Documents, E-Signatures) as
// tabs on one page — each tab is still independently gated by its own
// resource (forms / contract_settings / documents), same as before; a user
// missing one of the three just doesn't see that tab, rather than the whole
// page being all-or-nothing behind one permission.
const canViewForms = Auth.can('forms');
const canViewDocs = Auth.can('contract_settings');
const canViewEsign = Auth.can('documents');
const canEditForms = Auth.can('forms', 'can_edit');
const canEditDocs = Auth.can('contract_settings', 'can_edit');
const FDE_TABS = [
  ['forms', 'Form Builder', canViewForms],
  ['docs', 'Documents', canViewDocs],
  ['esign', 'E-Signatures', canViewEsign],
].filter(([, , visible]) => visible);
const firstTab = FDE_TABS[0]?.[0] || 'forms';

renderShell('/admin/forms-docs-esign', `
  <h2>Forms, Documents &amp; E-Signatures</h2>
  <div class="tabs">${FDE_TABS.map(([key, label], i) => `<button data-t="${key}" class="${i === 0 ? 'active' : ''}">${esc(label)}</button>`).join('')}</div>

  <div id="panel-forms" style="display:${firstTab === 'forms' ? 'block' : 'none'}">
    <div class="flex-between"><h3 style="margin-top:0">Form Builder</h3>${canEditForms ? '<button class="btn btn-primary btn-sm" id="btn-new">+ New Form</button>' : ''}</div>
    <p class="small-muted">Build custom forms and set them public, limited to a group of shuls, or a single shul/applicant.</p>
    <h4>Built-In Application Forms</h4>
    <p class="small-muted">The fixed shul, store, and applicant application pages — always live, not editable here. Copy the link to share.</p>
    <div id="builtin-links" style="margin-bottom:22px"></div>
    <div class="divider"></div>
    <h4>Custom Forms</h4>
    <div id="forms-list"></div>
  </div>

  <div id="panel-docs" style="display:${firstTab === 'docs' ? 'block' : 'none'}">
    <fieldset id="docs-fieldset" ${canEditDocs ? '' : 'disabled'} style="border:0;padding:0;margin:0">
      <p class="small-muted">Each of these can either use your own uploaded PDF as-is, or a simple generated document built from the text below. Whichever is used, the signer's signature is stamped onto the bottom of the last page automatically when they sign.</p>
      <div class="card">
        <h3>Shul Contract</h3>
        <div class="checkbox-row"><input type="checkbox" id="shul-contract-at-signup"><label style="margin:0">Require signing during signup</label></div>
        <p class="small-muted">When on (default), a shul signs the contract right after filling out their application, in the same sitting. When off, the contract is emailed to them separately instead — same statuses either way (contract sent / signed).</p>
        <button class="btn btn-sm btn-primary" style="margin-bottom:16px" onclick="saveContractAtSignup('shul')">Save</button>
        <p class="small-muted" id="pdf-status">Checking…</p>
        <input type="file" id="contract-pdf-file" accept="application/pdf">
        <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn btn-sm btn-primary" onclick="uploadContractPdf()">Upload PDF</button>
          <button class="btn btn-sm btn-outline" id="btn-remove-pdf" style="display:none" onclick="removeContractPdf()">Remove & Use Generated Template</button>
          <button class="btn btn-sm btn-outline" onclick="overrideSentContracts()">Override Sent, Unsigned Contracts</button>
        </div>
        <p class="small-muted" style="margin-top:6px">Uploading a new PDF or changing the text below only affects contracts sent from now on. Use "Override Sent, Unsigned Contracts" to update every contract that's already been sent but not yet signed — their existing links keep working, no new email is sent. Signed contracts are never touched.</p>
        <label style="margin-top:16px">Template Text <span class="small-muted">(used only if no PDF is uploaded above)</span></label>
        <textarea id="contract-text" rows="8"></textarea>
        <div style="margin-top:14px;display:flex;gap:8px">
          <button class="btn btn-sm btn-primary" onclick="saveContractText()">Save Text</button>
          <button class="btn btn-sm btn-outline" onclick="openSignatureBoxEditor('shul','Shul Contract Signature Placement')">Edit Signature Placement</button>
          <button class="btn btn-sm btn-outline" id="btn-fields-shul" style="display:none" onclick="openContractFieldEditor('shul','Shul Contract Field Placement')">Edit Contract Field Placement</button>
        </div>
      </div>
      <div class="card" style="margin-top:16px">
        <h3>Applicant Agreement</h3>
        <p class="small-muted" id="doc-pdf-status-applicant">Checking…</p>
        <input type="file" id="doc-pdf-file-applicant" accept="application/pdf">
        <div style="margin-top:12px;display:flex;gap:8px">
          <button class="btn btn-sm btn-primary" onclick="uploadDocPdf('applicant')">Upload PDF</button>
          <button class="btn btn-sm btn-outline" id="btn-remove-doc-pdf-applicant" style="display:none" onclick="removeDocPdf('applicant')">Remove & Use Generated Template</button>
        </div>
        <label style="margin-top:16px">Template Text <span class="small-muted">(used only if no PDF is uploaded above)</span></label>
        <textarea id="doc-text-applicant" rows="8"></textarea>
        <div style="margin-top:14px;display:flex;gap:8px">
          <button class="btn btn-sm btn-primary" onclick="saveDocText('applicant')">Save Text</button>
          <button class="btn btn-sm btn-outline" onclick="openSignatureBoxEditor('applicant','Applicant Agreement Signature Placement')">Edit Signature Placement</button>
          <button class="btn btn-sm btn-outline" id="btn-fields-applicant" style="display:none" onclick="openContractFieldEditor('applicant','Applicant Agreement Field Placement')">Edit Contract Field Placement</button>
        </div>
      </div>
      <div class="card" style="margin-top:16px">
        <h3>Store Agreement</h3>
        <div class="checkbox-row"><input type="checkbox" id="store-contract-at-signup"><label style="margin:0">Require signing during signup</label></div>
        <p class="small-muted">When on (default), a store signs the agreement right after applying, in the same sitting. When off, it's emailed to them separately instead — same statuses either way.</p>
        <button class="btn btn-sm btn-primary" style="margin-bottom:16px" onclick="saveContractAtSignup('store')">Save</button>
        <p class="small-muted" id="doc-pdf-status-store">Checking…</p>
        <input type="file" id="doc-pdf-file-store" accept="application/pdf">
        <div style="margin-top:12px;display:flex;gap:8px">
          <button class="btn btn-sm btn-primary" onclick="uploadDocPdf('store')">Upload PDF</button>
          <button class="btn btn-sm btn-outline" id="btn-remove-doc-pdf-store" style="display:none" onclick="removeDocPdf('store')">Remove & Use Generated Template</button>
        </div>
        <label style="margin-top:16px">Template Text <span class="small-muted">(used only if no PDF is uploaded above)</span></label>
        <textarea id="doc-text-store" rows="8"></textarea>
        <div style="margin-top:14px;display:flex;gap:8px">
          <button class="btn btn-sm btn-primary" onclick="saveDocText('store')">Save Text</button>
          <button class="btn btn-sm btn-outline" onclick="openSignatureBoxEditor('store','Store Agreement Signature Placement')">Edit Signature Placement</button>
          <button class="btn btn-sm btn-outline" id="btn-fields-store" style="display:none" onclick="openContractFieldEditor('store','Store Agreement Field Placement')">Edit Contract Field Placement</button>
        </div>
      </div>
    </fieldset>
  </div>

  <div id="panel-esign" style="display:${firstTab === 'esign' ? 'block' : 'none'}">
    <div class="flex-between"><h3 style="margin-top:0">E-Signatures</h3><button class="btn btn-primary btn-sm" id="btn-new-esign">New E-Signature Request</button></div>
    <p class="small-muted">Send a document out for signature to anyone — a vendor, a board member, anyone — with no applicant/store/shul record and no portal account needed. Separate from shul contracts and the per-applicant/store documents on their profiles.</p>
    <div class="card" style="padding:0;overflow-x:auto">
      <table><thead><tr><th>Title</th><th>Recipient</th><th>Status</th><th>Created</th><th>Sent</th><th>Signed</th><th></th></tr></thead>
      <tbody id="esign-tbody"><tr><td colspan="7" class="empty-state">Loading…</td></tr></tbody></table>
    </div>
  </div>
`);

qsa('.tabs button').forEach(b => b.addEventListener('click', () => {
  qsa('.tabs button').forEach(x => x.classList.remove('active')); b.classList.add('active');
  FDE_TABS.forEach(([t]) => { const el = qs('#panel-' + t); if (el) el.style.display = t === b.dataset.t ? 'block' : 'none'; });
}));

// ============================= Form Builder =============================

// The three fixed application flows (see utils/builtinSchemas.js) live at
// permanent URLs, not as editable rows here — an admin just needs the link
// to share, not a form to build. Ezras Habayis shares the applicant schema
// but has its own separate public URL/shul (see utils/ezrasHabayis.js).
const BUILTIN_LINKS = [
  { label: 'Shul Application', path: '/apply' },
  { label: 'Store Application', path: '/apply-store' },
  { label: 'Applicant Application', path: '/apply-ezras-habayis' },
];
function renderBuiltinLinks() {
  qs('#builtin-links').innerHTML = BUILTIN_LINKS.map(({ label, path }) => {
    const url = location.origin + path;
    return `<div class="card" style="margin-bottom:10px">
      <div class="flex-between">
        <div><strong>${esc(label)}</strong><br><span class="small-muted">${esc(url)}</span></div>
        <div class="pill-row">
          <a class="btn btn-sm btn-outline" href="${esc(path)}" target="_blank">Open</a>
          <button class="btn btn-sm btn-outline" onclick="copyBuiltinLink('${esc(url)}')">Copy Link</button>
        </div>
      </div>
    </div>`;
  }).join('');
}
window.copyBuiltinLink = async (url) => {
  try { await navigator.clipboard.writeText(url); toast('Link copied'); }
  catch { toast(url); }
};

let fieldDraft = [];
let formsCache = [];
let seasonsCache = [];

// Only relevant for forms created before #9 removed the type picker below —
// any of those three types can still exist on old rows; new forms are
// always 'general' and fall back to that label (see loadForms()).
const SECTION_LABEL = { shul_application: 'Shul Application', store_application: 'Store Application', applicant_application: 'Applicant Application' };
// Every custom form previews through the generic slug-driven renderer —
// the fixed public pages (apply.html etc.) no longer read from any form
// row at all (see utils/builtinSchemas.js), so there's no "this form is
// currently live at the fixed URL" case to special-case anymore.
function previewLink(f) { return '/form?slug=' + esc(f.slug); }
function scheduleStatus(f) {
  const now = new Date();
  if (!f.is_active) return badge('inactive', 'rejected');
  if (f.opens_at && now < new Date(f.opens_at)) return badge(`opens ${fmtDate(f.opens_at)}`, 'pending');
  if (f.closes_at && now > new Date(f.closes_at)) return badge('closed', 'rejected');
  return badge('open now', 'active');
}

async function loadForms() {
  const [{ forms }, { seasons }] = await Promise.all([api('/forms'), api('/seasons')]);
  formsCache = forms;
  seasonsCache = seasons;
  const seasonName = (id) => seasons.find(s => s.id === id)?.name || 'no season';
  qs('#forms-list').innerHTML = forms.length ? forms.map(f => `<div class="card" style="margin-bottom:12px">
      <div class="flex-between">
        <div><strong>${esc(f.name)}</strong> <span class="small-muted">/${esc(f.slug)}</span><br>
          <span class="small-muted">${esc(SECTION_LABEL[f.type] || 'General Form')} · ${esc(f.visibility)} · ${esc(seasonName(f.season_id))} · ${f.schema_json.length} field(s)${f.opens_at ? ` · opens ${fmtDate(f.opens_at)}` : ''}${f.closes_at ? ` · closes ${fmtDate(f.closes_at)}` : ''}</span></div>
        <div class="pill-row">
          ${scheduleStatus(f)}
          <a class="btn btn-sm btn-outline" href="${previewLink(f)}" target="_blank">Preview Link</a>
          <button class="btn btn-sm btn-outline" onclick="openEditForm('${f.id}')">${canEditForms ? 'Edit' : 'View'}</button>
          <button class="btn btn-sm btn-outline" onclick="openResponses('${f.id}')">Responses</button>
          ${canEditForms ? `<button class="btn btn-sm btn-outline" onclick="toggleForm('${f.id}', ${f.is_active ? 'false' : 'true'})">${f.is_active ? 'Deactivate' : 'Activate'}</button>` : ''}
        </div>
      </div>
    </div>`).join('') : '<p class="small-muted">No forms yet.</p>';
}
window.toggleForm = async (id, activate) => { try { await api(`/forms/${id}`, { method: 'PUT', body: { is_active: activate === 'true' } }); loadForms(); } catch (err) { toast(err.message, true); } };

qs('#btn-new')?.addEventListener('click', () => {
  fieldDraft = [{ key: '', label: '', type: 'text', required: false }];
  openModal('New Form', formBody(), `<button class="btn btn-primary btn-sm" onclick="createForm()">Create Form</button>`);
  renderFields();
});

window.openEditForm = (id) => {
  const f = formsCache.find(x => x.id === id);
  if (!f) return;
  fieldDraft = JSON.parse(JSON.stringify(f.schema_json));
  // Read-only: wrap the whole body in a disabled <fieldset> so every input,
  // select, and the "+ Add Field"/remove-field buttons rendered inside it
  // (including ones renderFields() adds afterward) are inert — same content,
  // genuinely can't be touched, rather than showing live controls that just
  // 403 on submit.
  const body = canEditForms ? formBody({ ...f, editing: true }) : `<fieldset disabled style="border:0;padding:0;margin:0">${formBody({ ...f, editing: true })}</fieldset>`;
  openModal(canEditForms ? 'Edit Form' : 'View Form (read-only)', body, canEditForms ? `<button class="btn btn-primary btn-sm" onclick="saveEditForm('${id}')">Save</button>` : '');
  renderFields();
};
window.saveEditForm = async (id) => {
  // datetime-local inputs give wall-clock time with no timezone — resolve
  // against the browser's own timezone into a real UTC instant before
  // sending, since the server (a different timezone on Render) compares
  // opens_at/closes_at as absolute instants, not wall-clock strings.
  const opensVal = qs('#f-opens').value, closesVal = qs('#f-closes').value;
  const body = {
    name: qs('#f-name').value, visibility: qs('#f-visibility').value, schema: fieldDraft, season_id: qs('#f-season').value, slug: qs('#f-slug').value,
    opens_at: opensVal ? new Date(opensVal).toISOString() : null, closes_at: closesVal ? new Date(closesVal).toISOString() : null,
  };
  try { await api(`/forms/${id}`, { method: 'PUT', body }); toast('Saved'); closeModal(); loadForms(); } catch (err) { toast(err.message, true); }
};

function toLocalInputValue(iso) { if (!iso) return ''; const d = new Date(iso); return isNaN(d) ? '' : new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16); }

function formBody(existing = null) {
  return `
    <label>Form Name *</label><input id="f-name" value="${existing ? esc(existing.name) : ''}">
    ${existing?.editing && SECTION_LABEL[existing.type] ? `<p class="small-muted">${esc(SECTION_LABEL[existing.type])} — built before general forms replaced this category; keeps behaving the same way.</p>` : ''}
    <label>Visibility</label><select id="f-visibility"><option value="public" ${existing?.visibility==='public'?'selected':''}>Public (anyone with the link)</option><option value="group" ${existing?.visibility==='group'?'selected':''}>Group of Shuls</option><option value="individual" ${existing?.visibility==='individual'?'selected':''}>Individual Shul</option></select>
    <label>Season *</label><select id="f-season">${seasonsCache.map(s => `<option value="${s.id}" ${(existing ? existing.season_id === s.id : s.is_active) ? 'selected' : ''}>${esc(s.name)}${s.is_active?' (active)':''}</option>`).join('')}</select>
    <label>URL Slug *</label><input id="f-slug" placeholder="e.g. shul-registration-2026" value="${existing ? esc(existing.slug) : ''}">
    ${existing?.editing ? `
    <div class="grid-2">
      <div><label>Opens <span class="small-muted">(blank = always open)</span></label><input type="datetime-local" id="f-opens" value="${toLocalInputValue(existing.opens_at)}"></div>
      <div><label>Closes <span class="small-muted">(blank = never closes)</span></label><input type="datetime-local" id="f-closes" value="${toLocalInputValue(existing.closes_at)}"></div>
    </div>` : ''}
    <div class="divider"></div>
    <div class="flex-between"><h4 style="margin:0">Fields</h4><button type="button" class="btn btn-sm btn-outline" onclick="addField()">+ Add Field</button></div>
    <div id="field-list"></div>
  `;
}
// 'header' and 'image' are presentational blocks, not real inputs — no Field
// Key (nothing to submit under), no Required (nothing to require). They
// still live in the same schema array/order as real fields, so an admin can
// interleave section headings and images between groups of fields.
const BLOCK_TYPES = ['header', 'image'];
// One option per line in the textarea, "value|label" (or just "label" to
// use the same text for both) — round-tripped to/from field.options
// ({value,label}[]) so a select field's real dropdown values can differ
// from what's displayed (e.g. home_for_yomtov: 1|Yes).
function optionsToText(options) { return (options || []).map(o => (o.value === o.label ? o.label : `${o.value}|${o.label}`)).join('\n'); }
function parseOptionsText(text) {
  return String(text || '').split('\n').map(l => l.trim()).filter(Boolean).map(line => {
    const idx = line.indexOf('|');
    return idx === -1 ? { value: line, label: line } : { value: line.slice(0, idx).trim(), label: line.slice(idx + 1).trim() };
  });
}
function renderFields() {
  qs('#field-list').innerHTML = fieldDraft.map((f, i) => {
    const isBlock = BLOCK_TYPES.includes(f.type);
    const isImage = f.type === 'image';
    const isNumber = f.type === 'number';
    const isSelect = f.type === 'select';
    return `<div class="card" style="margin:8px 0;padding:12px">
      <div class="grid-2">
        ${isBlock ? '' : `<div><label style="margin-top:0">Field Key</label><input value="${esc(f.key)}" onchange="fieldDraft[${i}].key=this.value"></div>`}
        <div style="${isBlock ? 'grid-column:1/-1' : ''}"><label style="margin-top:0">${isImage ? 'Alt Text' : 'Label'}</label><input value="${esc(f.label)}" onchange="fieldDraft[${i}].label=this.value"></div>
      </div>
      <div class="grid-2">
        <div><label style="margin-top:0">Type</label><select onchange="fieldDraft[${i}].type=this.value; renderFields()">
          ${['text','email','tel','number','textarea','checkbox','select','header','image'].map(t => `<option ${f.type===t?'selected':''}>${t}</option>`).join('')}
        </select></div>
        ${isBlock ? '' : `<div><label style="margin-top:0">Required</label><select onchange="fieldDraft[${i}].required=this.value==='1'"><option value="1" ${f.required?'selected':''}>Yes</option><option value="0" ${!f.required?'selected':''}>No</option></select></div>`}
      </div>
      <div style="margin-top:8px"><label style="margin-top:0">Alignment</label><select onchange="fieldDraft[${i}].align=this.value||undefined">
        <option value="" ${!f.align?'selected':''}>Left (default)</option>
        <option value="center" ${f.align==='center'?'selected':''}>Center</option>
        <option value="right" ${f.align==='right'?'selected':''}>Right</option>
      </select></div>
      ${isBlock ? '' : `<div class="checkbox-row" style="margin-top:8px">
        <input type="checkbox" id="fd-override-${i}" ${f.admin_override?'checked':''} onchange="fieldDraft[${i}].admin_override=this.checked">
        <label style="margin:0" for="fd-override-${i}">Admin can override — skip this field's requirement when an admin adds/imports on someone's behalf</label>
      </div>`}
      ${isNumber ? `<div class="grid-2" style="margin-top:8px">
        <div><label style="margin-top:0">Minimum <span class="small-muted">(optional)</span></label><input type="number" value="${f.min ?? ''}" onchange="fieldDraft[${i}].min=this.value===''?undefined:+this.value"></div>
        <div><label style="margin-top:0">Maximum <span class="small-muted">(optional)</span></label><input type="number" value="${f.max ?? ''}" onchange="fieldDraft[${i}].max=this.value===''?undefined:+this.value"></div>
      </div>` : ''}
      ${isSelect ? `<div style="margin-top:8px">
        <label style="margin-top:0">Options <span class="small-muted">(one per line — "value|label", or just a label to use it as both)</span></label>
        <textarea rows="4" onchange="updateFieldOptions(${i}, this.value)">${esc(optionsToText(f.options))}</textarea>
        <label style="margin-top:8px">Expected Answer <span class="small-muted">(optional — for review only, never shown to whoever fills out the form)</span></label>
        <select onchange="fieldDraft[${i}].expectedAnswer=this.value||undefined">
          <option value="">(none)</option>
          ${(f.options||[]).map(o => `<option value="${esc(o.value)}" ${f.expectedAnswer===o.value?'selected':''}>${esc(o.label)}</option>`).join('')}
        </select>
      </div>` : ''}
      ${isImage ? `<div style="margin-top:8px">
        <input type="file" accept="image/*" onchange="uploadFieldImage(${i}, this)">
        ${f.url ? `<img src="${esc(f.url)}" style="max-width:200px;max-height:120px;display:block;margin-top:8px;border-radius:6px">` : '<p class="small-muted">No image uploaded yet.</p>'}
      </div>` : ''}
      <button type="button" class="btn btn-sm btn-outline" style="margin-top:6px" onclick="removeField(${i})">Remove</button>
    </div>`;
  }).join('');
}
window.updateFieldOptions = (i, text) => { fieldDraft[i].options = parseOptionsText(text); renderFields(); };
window.addField = () => { fieldDraft.push({ key: '', label: '', type: 'text', required: false }); renderFields(); };
window.removeField = (i) => { fieldDraft.splice(i, 1); renderFields(); };
window.uploadFieldImage = async (i, input) => {
  const file = input.files[0];
  if (!file) return;
  const fd = new FormData(); fd.append('image', file);
  try {
    const { url } = await api('/forms/upload-image', { method: 'POST', isForm: true, body: fd });
    fieldDraft[i].url = url;
    renderFields();
    toast('Image uploaded');
  } catch (err) { toast(err.message, true); }
};

window.createForm = async () => {
  const body = { name: qs('#f-name').value, visibility: qs('#f-visibility').value, slug: qs('#f-slug').value, schema: fieldDraft, season_id: qs('#f-season').value };
  try { await api('/forms', { method: 'POST', body }); toast('Form created'); closeModal(); loadForms(); } catch (err) { toast(err.message, true); }
};

// Every raw submission to this form — the exportable "response table",
// independent of whether the submission also created a real shul/applicant/
// store record (see recordFormResponse() server-side). expectedAnswer is
// admin-only config (see the field editor above) — it's checked here, on
// the admin-only Responses view, and never sent to the public form itself
// (routes/forms.js strips it before any public response).
let responsesState = null;

// Rebuilds just the response rows against the current search filter — a
// plain client-side substring match across every visible field (plus the
// submitted date and which record type it created, if any), since these
// response tables are rarely more than a few hundred rows.
function renderResponseRows() {
  const { schema, responses, filter } = responsesState;
  const q = (filter || '').trim().toLowerCase();
  const filtered = !q ? responses : responses.filter(r => {
    if (String(r.entity_type || 'response only').toLowerCase().includes(q)) return true;
    if (fmtDateTime(r.created_at).toLowerCase().includes(q)) return true;
    return schema.some(fld => String(r.data[fld.key] ?? '').toLowerCase().includes(q));
  });
  if (!filtered.length) return `<p class="small-muted">${responses.length ? 'No responses match your search.' : 'No responses yet.'}</p>`;
  return `<div style="overflow-x:auto"><table><thead><tr><th>Submitted</th><th>Record</th>${schema.map(fld => `<th>${esc(fld.label || fld.key)}</th>`).join('')}<th></th></tr></thead><tbody>
      ${filtered.map(r => `<tr><td>${fmtDateTime(r.created_at)}</td><td>${r.entity_type ? esc(r.entity_type) : '<span class="small-muted">response only</span>'}</td>
        ${schema.map(fld => {
          const val = r.data[fld.key];
          const matched = fld.expectedAnswer !== undefined && fld.expectedAnswer !== '' && String(val ?? '') === String(fld.expectedAnswer);
          return `<td>${esc(val ?? '')}${matched ? ' ' + badge('matches expected', 'active') : ''}</td>`;
        }).join('')}
        <td><button class="btn btn-sm btn-outline" style="color:#b71c1c;border-color:#b71c1c" onclick="deleteResponse('${r.id}')">Delete</button></td>
      </tr>`).join('')}
    </tbody></table></div>`;
}
// Updates the already-open modal in place (row count in the title, the
// table body) — never re-opens it, so filtering/deleting never stacks a
// second modal on top of the first.
function refreshResponsesUI() {
  const table = qs('#resp-table');
  if (table) table.innerHTML = renderResponseRows();
  const titleEl = document.querySelector('#ec-modal .modal-header h3');
  if (titleEl) titleEl.textContent = `${responsesState.name}: Responses (${responsesState.responses.length})`;
}

window.openResponses = async (id) => {
  const f = formsCache.find(x => x.id === id);
  if (!f) return;
  try {
    const { responses } = await api(`/forms/${id}/responses`);
    const schema = f.schema_json.filter(fld => !['header', 'image'].includes(fld.type));
    responsesState = { formId: id, name: f.name, slug: f.slug, schema, responses, filter: '' };
    const body = `<input id="resp-filter" placeholder="Search responses…" style="margin-bottom:12px;width:100%;max-width:340px">
      <div id="resp-table">${renderResponseRows()}</div>`;
    const footer = `<button class="btn btn-outline btn-sm" onclick="downloadAuthed('/forms/${id}/responses/export','${esc(f.slug || 'form')}-responses.xlsx')">Export Excel</button>`;
    openModal(`${f.name}: Responses (${responses.length})`, body, footer, { wide: true });
    qs('#resp-filter').addEventListener('input', (e) => { responsesState.filter = e.target.value; refreshResponsesUI(); });
  } catch (err) { toast(err.message, true); }
};

window.deleteResponse = async (responseId) => {
  if (!responsesState) return;
  if (!confirm('Delete this response? This removes only the logged submission row — any shul/applicant/store record it created stays and must be deleted separately from its own list.')) return;
  try {
    await api(`/forms/${responsesState.formId}/responses/${responseId}`, { method: 'DELETE' });
    responsesState.responses = responsesState.responses.filter(r => r.id !== responseId);
    refreshResponsesUI();
    toast('Response deleted');
  } catch (err) { toast(err.message, true); }
};

// ============================= Documents =============================

async function loadContractAtSignup() {
  const { settings } = await api('/contract-settings');
  qs('#shul-contract-at-signup').checked = settings.shul_contract_at_signup !== '0';
  qs('#store-contract-at-signup').checked = settings.store_contract_at_signup !== '0';
}
window.saveContractAtSignup = async (entityType) => {
  const checked = qs(`#${entityType}-contract-at-signup`).checked;
  try { await api('/contract-settings', { method: 'PUT', body: { [`${entityType}_contract_at_signup`]: checked ? '1' : '0' } }); toast('Saved'); } catch (err) { toast(err.message, true); }
};

async function loadContractText() {
  const { settings } = await api('/contract-settings');
  qs('#contract-text').value = settings.contract_template_text || '';
}
window.saveContractText = async () => { try { await api('/contract-settings', { method: 'PUT', body: { contract_template_text: qs('#contract-text').value } }); toast('Saved'); } catch (err) { toast(err.message, true); } };

async function loadContractPdfStatus() {
  const { hasCustomTemplate } = await api('/contract-settings/contract-pdf');
  qs('#pdf-status').innerHTML = hasCustomTemplate
    ? '<strong style="color:var(--success)">A custom contract PDF is currently in use.</strong>'

  qs('#btn-fields-shul').style.display = hasCustomTemplate ? 'inline-flex' : 'none';
}
window.uploadContractPdf = async () => {

  const fd = new FormData(); fd.append('file', file);

};
window.removeContractPdf = async () => {
  if (!confirm('Remove the custom PDF and go back to the generated text template?')) return;
  try { await api('/contract-settings/contract-pdf', { method: 'DELETE' }); toast('Removed'); loadContractPdfStatus(); } catch (err) { toast(err.message, true); }
};
window.overrideSentContracts = async () => {
  if (!confirm('Update every sent-but-unsigned contract to the current template? Existing signing links keep working — no new email is sent. Signed contracts are never touched.')) return;
  try {
    const { updated } = await api('/shuls/contracts/regenerate-unsigned', { method: 'POST' });
    toast(updated ? `Updated ${updated} unsigned contract${updated === 1 ? '' : 's'}` : 'No sent-but-unsigned contracts to update');
  } catch (err) { toast(err.message, true); }
};

// ============================= E-Signatures =============================

async function loadEsign() {
  try {
    const { documents } = await api('/documents/standalone');
    qs('#esign-tbody').innerHTML = documents.length ? documents.map(esignRowHtml).join('') : '<tr><td colspan="7" class="empty-state">No e-signature requests yet.</td></tr>';
  } catch (err) { toast(err.message, true); }
}
function esignRowHtml(d) {
  const canAct = d.status !== 'signed' && d.status !== 'void';
  return `<tr>
    <td><strong>${esc(d.title || 'Agreement')}</strong></td>
    <td>${esc(d.recipient_name || '')}<br><span class="small-muted">${esc(d.recipient_email || '')}</span></td>
    <td>${badge(d.status, d.status)}</td>
    <td>${fmtDateTime(d.created_at)}</td>
    <td>${d.sent_at ? fmtDateTime(d.sent_at) : ''}</td>
    <td>${d.signed_at ? fmtDateTime(d.signed_at) + ' by ' + esc(d.signer_name || '') : ''}</td>
    <td style="display:flex;gap:6px;flex-wrap:wrap">
      <button class="btn btn-sm btn-outline" onclick="viewDocumentPdf('${d.id}')">View PDF</button>
      ${d.status !== 'signed' ? `<button class="btn btn-sm btn-outline" onclick="openStandaloneFieldEditor('${d.id}','${esc(d.title || 'Agreement').replace(/'/g,"\\'")}')">Edit Fields</button>` : ''}
      ${canAct ? `<button class="btn btn-sm btn-primary" onclick="sendStandaloneDoc('${d.id}')">${d.status === 'sent' ? 'Resend' : 'Send'}</button>` : ''}
      ${canAct ? `<button class="btn btn-sm btn-outline" onclick="voidStandaloneDoc('${d.id}')">Void</button>` : ''}
      ${d.status === 'signed' ? `<button class="btn btn-sm btn-outline" onclick="retractStandaloneDoc('${d.id}')">Retract Signature</button>` : ''}
    </td>
  </tr>`;
}

window.sendStandaloneDoc = async (id) => {
  try {
    const r = await api(`/documents/${id}/send`, { method: 'POST', body: {} });
    toast(r.emailError ? `Link created, but email failed: ${r.emailError}` : 'Signing link sent', !!r.emailError);
    loadEsign();
  } catch (err) { toast(err.message, true); }
};
window.voidStandaloneDoc = async (id) => {
  if (!confirm('Void this e-signature request?')) return;
  try { await api(`/documents/${id}/void`, { method: 'POST' }); toast('Voided'); loadEsign(); } catch (err) { toast(err.message, true); }
};
window.retractStandaloneDoc = async (id) => {
  if (!confirm('Retract this signature? The document will go back to unsigned and can be signed again.')) return;
  try { await api(`/documents/${id}/retract`, { method: 'POST' }); toast('Signature retracted'); loadEsign(); } catch (err) { toast(err.message, true); }
};

qs('#btn-new-esign')?.addEventListener('click', () => {
  const body = `
    <label>Recipient Name <span class="req">*</span></label><input id="es-name" placeholder="Full name">
    <label>Recipient Email <span class="req">*</span></label><input id="es-email" type="email" placeholder="email@example.com">
    <label>Document Title</label><input id="es-title" placeholder="e.g. Vendor Agreement">
    <div class="divider"></div>
    <label>Upload PDF <span class="small-muted">(or leave blank and type the document text below)</span></label>
    <input id="es-file" type="file" accept="application/pdf">
    <label>Document Text <span class="small-muted">(used only if no PDF is uploaded)</span></label>
    <textarea id="es-body" rows="6" placeholder="The full text of the agreement..."></textarea>
  `;
  openModal('New E-Signature Request', body, `<button class="btn btn-primary btn-sm" onclick="createStandaloneDoc()">Create</button>`);
});

window.createStandaloneDoc = async () => {
  const recipient_name = qs('#es-name').value.trim();
  const recipient_email = qs('#es-email').value.trim();
  const title = qs('#es-title').value.trim();
  const bodyText = qs('#es-body').value.trim();
  const file = qs('#es-file').files[0];
  if (!recipient_name || !recipient_email) return toast('Recipient name and email are required', true);
  if (!file && !bodyText) return toast('Upload a PDF or enter the document text', true);

  const fd = new FormData();
  fd.append('recipient_name', recipient_name);
  fd.append('recipient_email', recipient_email);
  fd.append('title', title);
  if (bodyText) fd.append('body_text', bodyText);
  if (file) fd.append('file', file);

  try {
    await api('/documents/standalone', { method: 'POST', isForm: true, body: fd });
    toast('E-signature request created');
    closeModal(); loadEsign();
  } catch (err) { toast(err.message, true); }
};

// Draggable/resizable field editor for one specific standalone document —
// same drag/resize mechanics as the shared per-kind signature-box editor
// (openSignatureBoxEditor in app.js, used by the Documents tab above), just
// scoped to /documents/:id/fields instead of an org-wide setting, since a
// standalone document has no fixed template to share placement across.
let esFieldState = null;
const ES_TYPE_LABEL = { signature: 'Signature', initial: 'Initial', date: 'Date', text: 'Text' };
window.openStandaloneFieldEditor = async (id, title) => {
  let data;
  try { data = await api(`/documents/${id}/fields`); } catch (err) { return toast(err.message, true); }
  const pageSize = data.pageSize;
  let fields = (data.fields && data.fields.length) ? data.fields.map(f => ({ ...f })) : [{ id: 'signature', type: 'signature', label: 'Signature', required: true, x: 0.09, y: 0.62, width: 0.42, height: 0.22 }];
  let activeId = fields[0].id;
  const mockW = 320;
  const mockH = Math.round(mockW * pageSize.height / pageSize.width);

  const bodyHtml = `
    <p class="small-muted">Drag a field to position it, drag its corner to resize. Add multiple fields for extra signatures, initials, a date, or free text the signer fills in.</p>
    <div id="esfield-page" style="position:relative;width:${mockW}px;height:${mockH}px;margin:16px auto;background:#fff;border:1px solid var(--border);box-shadow:var(--shadow);overflow:hidden">
      <canvas id="esfield-canvas" style="position:absolute;inset:0;width:100%;height:100%"></canvas>
      <div id="esfield-loading" class="small-muted" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px">Loading page preview…</div>
      <div id="esfield-boxes" style="position:absolute;inset:0"></div>
    </div>
    <div style="text-align:center;margin-bottom:12px">
      <button type="button" class="btn btn-outline btn-sm" onclick="addStandaloneField('signature')">+ Signature</button>
      <button type="button" class="btn btn-outline btn-sm" onclick="addStandaloneField('initial')">+ Initial</button>
      <button type="button" class="btn btn-outline btn-sm" onclick="addStandaloneField('date')">+ Date</button>
      <button type="button" class="btn btn-outline btn-sm" onclick="addStandaloneField('text')">+ Text</button>
    </div>
    <div id="esfield-fields"></div>
    <p class="small-muted" style="text-align:center">Page size: ${Math.round(pageSize.width)} &times; ${Math.round(pageSize.height)} pt &mdash; showing the document's last page, where the signature area normally goes</p>
  `;
  openModal(title, bodyHtml, `<button class="btn btn-primary btn-sm" onclick="saveStandaloneFields('${id}')">Save Placement</button>`);
  renderPdfPreviewBackground(`/documents/${id}/pdf`, mockW, mockH, 'esfield-canvas', 'esfield-loading');

  function startDrag(e, f, mode) {
    e.preventDefault(); e.stopPropagation();
    activeId = f.id;
    const startPx = { x: e.clientX, y: e.clientY };
    const startBox = { x: f.x, y: f.y, width: f.width, height: f.height };
    function onMove(ev) {
      const dx = (ev.clientX - startPx.x) / mockW, dy = (ev.clientY - startPx.y) / mockH;
      if (mode === 'move') {
        f.x = Math.min(1 - f.width, Math.max(0, startBox.x + dx));
        f.y = Math.min(1 - f.height, Math.max(0, startBox.y + dy));
      } else {
        f.width = Math.min(1 - f.x, Math.max(0.1, startBox.width + dx));
        f.height = Math.min(1 - f.y, Math.max(0.05, startBox.height + dy));
      }
      renderBoxes();
    }
    function onUp() { window.removeEventListener('pointermove', onMove); window.removeEventListener('pointerup', onUp); }
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
  }

  function renderBoxes() {
    const page = qs('#esfield-boxes');
    if (!page) return;
    page.innerHTML = '';
    fields.forEach(f => {
      const box = document.createElement('div');
      const active = f.id === activeId;
      box.style.cssText = `position:absolute;left:${f.x * mockW}px;top:${f.y * mockH}px;width:${f.width * mockW}px;height:${f.height * mockH}px;background:rgba(201,167,106,.35);border:2px solid ${active ? 'var(--brand-gold-dark)' : '#999'};cursor:move;box-sizing:border-box;font-size:10px;color:#241a15;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden`;
      box.textContent = f.label || ES_TYPE_LABEL[f.type];
      box.addEventListener('pointerdown', (e) => startDrag(e, f, 'move'));
      const handle = document.createElement('div');
      handle.style.cssText = 'position:absolute;right:-7px;bottom:-7px;width:14px;height:14px;background:var(--brand-gold-dark);cursor:nwse-resize';
      handle.addEventListener('pointerdown', (e) => startDrag(e, f, 'resize'));
      box.appendChild(handle);
      page.appendChild(box);
    });
  }

  function renderFieldsList() {
    const el = qs('#esfield-fields');
    if (!el) return;
    el.innerHTML = fields.map(f => `
      <div style="display:flex;gap:6px;align-items:center;margin-bottom:6px;padding:6px;border:1px solid ${f.id === activeId ? 'var(--brand-gold-dark)' : 'var(--border)'};border-radius:4px">
        <select data-fid="${f.id}" class="esfield-type" style="width:100px">
          ${Object.keys(ES_TYPE_LABEL).map(t => `<option value="${t}" ${f.type === t ? 'selected' : ''}>${ES_TYPE_LABEL[t]}</option>`).join('')}
        </select>
        <input data-fid="${f.id}" class="esfield-label" placeholder="Label" value="${esc(f.label || '')}" style="flex:1">
        <label class="small-muted" style="display:flex;align-items:center;gap:3px;white-space:nowrap"><input type="checkbox" data-fid="${f.id}" class="esfield-required" ${f.required !== false ? 'checked' : ''}> Required</label>
        <button type="button" class="btn btn-outline btn-sm" onclick="selectStandaloneField('${f.id}')">Select</button>
        ${fields.length > 1 ? `<button type="button" class="btn btn-outline btn-sm" onclick="removeStandaloneField('${f.id}')">&times;</button>` : ''}
      </div>
    `).join('');
    qsa('.esfield-type').forEach(sel => sel.onchange = () => { const f = fields.find(x => x.id === sel.dataset.fid); f.type = sel.value; renderBoxes(); });
    qsa('.esfield-label').forEach(inp => inp.oninput = () => { const f = fields.find(x => x.id === inp.dataset.fid); f.label = inp.value; renderBoxes(); });
    qsa('.esfield-required').forEach(cb => cb.onchange = () => { const f = fields.find(x => x.id === cb.dataset.fid); f.required = cb.checked; });
  }

  window.addStandaloneField = (type) => {
    const id2 = 'f' + Math.random().toString(36).slice(2, 9);
    fields.push({ id: id2, type, label: ES_TYPE_LABEL[type], required: true, x: 0.1, y: 0.1, width: type === 'signature' ? 0.4 : 0.25, height: type === 'signature' ? 0.18 : 0.08 });
    activeId = id2;
    renderBoxes(); renderFieldsList();
  };
  window.removeStandaloneField = (fid) => {
    fields = fields.filter(f => f.id !== fid);
    if (activeId === fid) activeId = fields[0]?.id;
    renderBoxes(); renderFieldsList();
  };
  window.selectStandaloneField = (fid) => { activeId = fid; renderBoxes(); renderFieldsList(); };

  renderBoxes();
  renderFieldsList();
  esFieldState = { id, get: () => fields };
};
window.saveStandaloneFields = async (id) => {
  const fields = esFieldState?.id === id ? esFieldState.get() : null;
  if (!fields || !fields.length) return;
  try {
    await api(`/documents/${id}/fields`, { method: 'PUT', body: { fields } });
    toast('Field placement saved');
    closeModal();
  } catch (err) { toast(err.message, true); }
};

// ============================= Init =============================

if (canViewForms) { renderBuiltinLinks(); loadForms(); }
if (canViewDocs) { loadContractText(); loadContractPdfStatus(); loadContractAtSignup(); loadDocPdfStatus('applicant'); loadDocPdfStatus('store'); loadDocText('applicant'); loadDocText('store'); }
if (canViewEsign) loadEsign();
</script>
