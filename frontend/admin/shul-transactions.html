<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shul Transactions · Kupes Hair Williamsburg</title>
<link rel="stylesheet" href="/css/theme.css">
<link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="stylesheet" href="/css/portal-theme.css">
</head>
<body>
<script src="/js/app.js"></script>
<script>
Auth.requireAdmin();
if (!Auth.can('shul_payments')) { location.href = '/admin/dashboard'; }
renderShell('/admin/shul-transactions', `
  <h2>Shul Transactions</h2>
  <p class="small-muted">Every shul's payments and money given to applicants, in one place — the same actions available from a shul's own Payments tab, across every shul at once.</p>
  <div class="toolbar">
    <select id="f-shul"><option value="">All Shuls</option></select>
    <select id="f-season"><option value="">All Seasons</option></select>
    <select id="f-status" style="display:none"><option value="">All Statuses</option><option value="pending_approval">Pending Approval</option><option value="approved">Approved</option><option value="rejected">Rejected</option></select>
  </div>
  <div class="tabs">
    <button class="active" id="tab-payments-btn">Payments</button>
    <button id="tab-allocations-btn">Allocations</button>
    <button id="tab-requests-btn">Payment Method Requests</button>
    <button id="tab-shultotals-btn">Shul Totals</button>
  </div>
  <div id="panel-payments">
    <div class="card" style="margin-bottom:16px">
      <h3 style="margin-top:0">Add Manual Payment</h3>
      <div class="grid-2">
        <div><label style="margin-top:0">Shul</label><select id="mp-shul"><option value="">Select a shul…</option></select></div>
        <div><label style="margin-top:0">Season</label><select id="mp-season"><option value="">Select a season…</option></select></div>
      </div>
      <div class="grid-2" style="margin-top:10px">
        <div><label style="margin-top:0">Method</label><select id="mp-method"></select></div>
        <div><label style="margin-top:0">Amount ($)</label><input id="mp-amount" type="number" min="0.01" step="0.01"></div>
      </div>
      <div class="grid-2" style="margin-top:10px">
        <div><label style="margin-top:0">Date</label><input id="mp-date" type="date"></div>
        <div><label style="margin-top:0">Time</label><input id="mp-time" type="time"></div>
      </div>
      <label style="margin-top:10px">Ref# / Check#</label><input id="mp-ref">
      <label style="margin-top:10px">Notes</label><textarea id="mp-notes" rows="2"></textarea>
      <button class="btn btn-sm btn-primary" style="margin-top:12px" onclick="submitManualPayment()">Add Payment</button>
    </div>
    <div class="card" style="margin-bottom:16px">
      <h3 style="margin-top:0">Charge Credit Card</h3>
      <p class="small-muted" id="ac-mock-note" style="display:none">Test mode — no real charge will be made.</p>
      <!-- Same plain (non-iframe) card fields as the shul portal's own
           payment form, POSTed straight to this app's backend and forwarded
           to Sola — see services/sola.js's file-level PCI-scope comment.
           Never logged. -->
      <div class="grid-2">
        <div><label style="margin-top:0">Shul</label><select id="ac-shul"><option value="">Select a shul…</option></select></div>
        <div><label style="margin-top:0">Season</label><select id="ac-season"><option value="">Select a season…</option></select></div>
      </div>
      <label style="margin-top:10px">Amount ($)</label><input id="ac-amount" type="number" min="0.01" step="0.01" style="max-width:220px">
      <label style="margin-top:10px">Card Number</label><input id="ac-card-num" placeholder="1234 1234 1234 1234" maxlength="19" style="max-width:420px" autocomplete="cc-number" inputmode="numeric">
      <div class="grid-2" style="max-width:420px">
        <div><label style="margin-top:0">Expiration (MM/YY)</label><input id="ac-exp" placeholder="MM/YY" maxlength="5" autocomplete="cc-exp" inputmode="numeric"></div>
        <div><label style="margin-top:0">CVV</label><input id="ac-cvv" placeholder="123" maxlength="4" autocomplete="cc-csc" inputmode="numeric"></div>
      </div>
      <label style="margin-top:10px">Billing ZIP</label><input id="ac-zip" maxlength="10" style="max-width:140px" autocomplete="postal-code">
      <button class="btn btn-sm btn-primary" style="margin-top:12px" id="btn-ac" onclick="submitAdminCharge()">Charge</button>
      <div id="ac-status" class="small-muted" style="margin-top:8px"></div>
    </div>
    <div class="card" style="margin-bottom:16px">
      <h3 style="margin-top:0">Pay Shul</h3>
      <p class="small-muted">Records money the org paid BACK to a shul (e.g. a refund) — just a transaction record, no card processing. Reduces the shul's Approved Balance by this amount.</p>
      <div class="grid-2">
        <div><label style="margin-top:0">Shul</label><select id="po-shul"><option value="">Select a shul…</option></select></div>
        <div><label style="margin-top:0">Season</label><select id="po-season"><option value="">Select a season…</option></select></div>
      </div>
      <div class="grid-2" style="margin-top:10px">
        <div><label style="margin-top:0">Method</label><select id="po-method"></select></div>
        <div><label style="margin-top:0">Amount ($)</label><input id="po-amount" type="number" min="0.01" step="0.01"></div>
      </div>
      <div class="grid-2" style="margin-top:10px">
        <div><label style="margin-top:0">Date</label><input id="po-date" type="date"></div>
        <div><label style="margin-top:0">Time</label><input id="po-time" type="time"></div>
      </div>
      <label style="margin-top:10px">Ref# / Check#</label><input id="po-ref">
      <label style="margin-top:10px">Notes</label><textarea id="po-notes" rows="2"></textarea>
      <button class="btn btn-sm btn-primary" style="margin-top:12px" onclick="submitPayout()">Pay Shul</button>
    </div>
    <div class="card" style="padding:0;overflow-x:auto">
      <table><thead><tr><th>Shul</th><th>Type</th><th>Method</th><th>Amount</th><th>Fee</th><th>Net</th><th>Status</th><th>Ref#</th><th>Entered By</th><th>Date</th><th></th></tr></thead>
      <tbody id="tbody-payments"><tr><td colspan="11" class="empty-state">Loading…</td></tr></tbody></table>
    </div>
  </div>
  <div id="panel-allocations" style="display:none">
    <div class="card" style="margin-bottom:16px">
      <h3 style="margin-top:0">Give to an Applicant</h3>
      <p class="small-muted">Draws down the shul's Approved Balance, same as the shul giving it themselves. Check "Admin override" to give money regardless of that shul's current balance (e.g. a special case approved outside the normal flow).</p>
      <div class="grid-2">
        <div><label style="margin-top:0">Shul</label><select id="al-shul"><option value="">Select a shul…</option></select></div>
        <div><label style="margin-top:0">Applicant</label><select id="al-applicant"><option value="">Select a shul first…</option></select></div>
      </div>
      <div class="grid-2" style="margin-top:10px">
        <div><label style="margin-top:0">Amount ($)</label><input id="al-amount" type="number" min="0.01" step="0.01"></div>
        <div style="display:flex;align-items:flex-end"><div class="checkbox-row"><input type="checkbox" id="al-override"><label style="margin:0">Admin override (ignore balance)</label></div></div>
      </div>
      <button class="btn btn-sm btn-primary" style="margin-top:12px" onclick="submitAdminAllocation()">Give</button>
    </div>
    <div class="card" style="padding:0;overflow-x:auto">
      <table><thead><tr><th>Shul</th><th>Applicant</th><th>Given</th><th>Match</th><th>Total</th><th>By</th><th>Date</th><th></th></tr></thead>
      <tbody id="tbody-allocations"><tr><td colspan="8" class="empty-state">Loading…</td></tr></tbody></table>
    </div>
  </div>
  <div id="panel-requests" style="display:none">
    <p class="small-muted">A shul asking for a payment method other than online card payment (Settings > Notify on Payment Method Requests controls who gets emailed when one comes in).</p>
    <div class="card" style="padding:0;overflow-x:auto">
      <table><thead><tr><th>Shul</th><th>Requested Method</th><th>Message</th><th>Date</th></tr></thead>
      <tbody id="tbody-requests"><tr><td colspan="4" class="empty-state">Loading…</td></tr></tbody></table>
    </div>
  </div>
  <div id="panel-shultotals" style="display:none">
    <p class="small-muted">Every shul's lifetime Total Paid (their own money only — never the match), one row per shul, not divided by transaction.</p>
    <div class="toolbar"><input id="st-search" placeholder="Search shuls…" style="max-width:280px"></div>
    <div class="card" style="padding:0;overflow-x:auto">
      <table><thead><tr>
        <th data-sort="nameEn">Shul</th><th data-sort="nameHe">Shul (Hebrew)</th><th data-sort="totalPaid">Total Paid</th>
      </tr></thead>
      <tbody id="tbody-shultotals"><tr><td colspan="3" class="empty-state">Loading…</td></tr></tbody></table>
    </div>
  </div>
`);

// Populated by loadMethodOptions() below from Settings > Shul Payments >
// Payment Method Options (admin-editable — see app.js's
// loadManualPaymentMethods) — starts with the same fallback defaults so the
// page renders sensibly before that call resolves. sola_card/sola_refund/
// stripe_card are never admin-editable (they're not manual methods at all,
// just how a real card charge/refund/legacy-Stripe row is labeled).
let MANUAL_METHOD_LABEL = { stripe_card: 'Card (Stripe, legacy)', sola_card: 'Card (Sola)', sola_refund: 'Refund (Sola)' };
DEFAULT_MANUAL_PAYMENT_METHODS.forEach(m => { MANUAL_METHOD_LABEL[m.value] = m.label; });
async function loadMethodOptions() {
  const methods = await loadManualPaymentMethods();
  methods.forEach(m => { MANUAL_METHOD_LABEL[m.value] = m.label; });
  const active = methods.filter(m => m.active !== false);
  const optionsHtml = active.map(m => `<option value="${esc(m.value)}">${esc(m.label)}</option>`).join('');
  qs('#mp-method').innerHTML = optionsHtml;
  qs('#po-method').innerHTML = optionsHtml;
}
const state = { shul_id: '', season_id: '', status: '' };
let activeTab = 'payments';

function currentFilterParams() {
  const p = {};
  if (state.shul_id) p.shul_id = state.shul_id;
  if (state.season_id) p.season_id = state.season_id;
  if (activeTab === 'payments' && state.status) p.status = state.status;
  return new URLSearchParams(p).toString();
}

let lastPayments = [];
async function loadPayments() {
  const { payments } = await api('/shul-payments?' + currentFilterParams());
  lastPayments = payments;
  // Refunds are their own rows (method sola_refund, refund_of pointing back
  // at the original charge) — summed here just to know how much of each
  // charge is still refundable and to show a small "Refunded: $X" note;
  // the server independently enforces the real cap on every refund request.
  const refundedByPaymentId = {};
  payments.forEach(p => { if (p.refund_of) refundedByPaymentId[p.refund_of] = (refundedByPaymentId[p.refund_of] || 0) + (-p.net_amount); });
  qs('#tbody-payments').innerHTML = payments.length ? payments.map(p => {
    const refunded = refundedByPaymentId[p.id] || 0;
    // Refundable regardless of approval status — the real Sola charge
    // happened the instant the shul submitted it, before any admin review,
    // so a still-pending or already-rejected charge is just as real and
    // just as refundable as an approved one (see the server's identical
    // POST /:id/refund comment for why it doesn't check status either).
    const refundable = p.method === 'sola_card' && p.direction === 'in' ? Math.round((p.amount - refunded) * 100) / 100 : 0;
    // A real card transaction (a Sola charge/refund, or a legacy Stripe
    // charge) moved actual money through a processor — it can never be
    // deleted, only reversed for real (Refund) or, for the legacy Stripe
    // case with no live refund path left, recorded via Pay Shul. See the
    // server's identical DELETE /:id check.
    const isCardMethod = p.method === 'sola_card' || p.method === 'sola_refund' || p.method === 'stripe_card';
    return `<tr>
      <td>${esc(p.shul_name||'')}</td>
      <td>${p.direction === 'out' ? badge('Paid to Shul', 'pending') : badge('Paid In', 'active')}</td>
      <td>${MANUAL_METHOD_LABEL[p.method] || p.method}${p.card_last4 ? `<div class="small-muted">&bull;&bull;&bull;&bull; ${esc(p.card_last4)}</div>` : ''}</td>
      <td>${p.direction === 'out' ? '-' : ''}${fmtMoney(p.amount)}${refunded > 0 ? `<div class="small-muted">Refunded: ${fmtMoney(refunded)}</div>` : ''}</td>
      <td>${fmtMoney(p.fee_amount)}${p.direction === 'in' ? ` <button class="btn btn-outline btn-sm" style="padding:1px 6px" onclick="openFeeModal('${p.id}')">Edit</button>` : ''}</td>
      <td>${p.direction === 'out' ? '-' : ''}${fmtMoney(Math.abs(p.net_amount))}</td>
      <td>${badge(p.status, p.status === 'approved' ? 'active' : (p.status === 'rejected' ? 'rejected' : 'pending'))}</td>
      <td>${esc(p.manual_ref||'')}</td>
      <td>${esc(p.entered_by_first||'')} ${esc(p.entered_by_last||'')}</td>
      <td>${fmtDateTime(p.created_at)}</td>
      <td>${p.status === 'pending_approval' ? `<button class="btn btn-outline btn-sm" onclick="approvePayment('${p.id}')">Approve</button> <button class="btn btn-outline btn-sm" onclick="rejectPayment('${p.id}')">Reject</button> ` : ''}${refundable > 0.005 ? `<button class="btn btn-outline btn-sm" onclick="openRefundModal('${p.id}')">Refund</button> ` : ''}${isCardMethod ? '' : `<button class="btn btn-outline btn-sm" onclick="deletePayment('${p.id}')">Delete</button>`}</td>
    </tr>`;
  }).join('') : '<tr><td colspan="11" class="empty-state">No payments match these filters.</td></tr>';
}
window.approvePayment = async (id) => {
  try { await api(`/shul-payments/${id}/approve`, { method: 'POST' }); toast('Approved'); loadPayments(); } catch (err) { toast(err.message, true); }
};
window.rejectPayment = async (id) => {
  const reason = prompt('Reason for rejecting this payment (optional):') || '';
  try { await api(`/shul-payments/${id}/reject`, { method: 'POST', body: { reason } }); toast('Rejected'); loadPayments(); } catch (err) { toast(err.message, true); }
};
window.openRefundModal = (id) => {
  const p = lastPayments.find(x => x.id === id);
  if (!p) return;
  const refunded = lastPayments.filter(x => x.refund_of === id).reduce((s, x) => s + (-x.net_amount), 0);
  const refundable = Math.round((p.amount - refunded) * 100) / 100;
  const feeWarning = p.fee_amount > 0
    ? `<p class="small-muted" style="color:var(--danger,#b91c1c)">This payment had a ${fmtMoney(p.fee_amount)} processing fee. Refunding does NOT automatically return that fee — it stays collected regardless of how much of the principal you refund here.</p>`
    : '';
  const body = `
    <p class="small-muted">Refunding ${esc(p.shul_name || '')}'s ${fmtMoney(p.amount)} card payment. Up to ${fmtMoney(refundable)} can still be refunded.</p>
    ${feeWarning}
    <label>Refund Amount ($)</label><input id="rf-amount" type="number" min="0.01" max="${refundable}" step="0.01" value="${refundable}">
  `;
  openModal('Refund Payment', body, `<button class="btn btn-primary btn-sm" onclick="submitRefund('${id}')">Refund</button>`);
};
window.submitRefund = async (id) => {
  const amount = +qs('#rf-amount').value;
  if (!(amount > 0)) return toast('Enter a valid amount', true);
  try {
    const { feeNote } = await api(`/shul-payments/${id}/refund`, { method: 'POST', body: { amount } });
    toast(feeNote ? `Refunded — ${feeNote}` : 'Refunded');
    closeModal();
    loadPayments();
  } catch (err) { toast(err.message, true); }
};
// Sola doesn't hand back a real per-transaction fee the way Stripe used to
// (see services/sola.js) — this is how an admin sets it manually once they
// know it (e.g. from a Sola statement), for any payment the shul made.
window.openFeeModal = (id) => {
  const p = lastPayments.find(x => x.id === id);
  if (!p) return;
  const body = `
    <p class="small-muted">${esc(p.shul_name || '')}'s ${fmtMoney(p.amount)} payment. Setting a fee reduces the net amount that counts toward their balance.</p>
    <label>Processing Fee ($)</label><input id="fee-amount" type="number" min="0" max="${p.amount}" step="0.01" value="${p.fee_amount}">
  `;
  openModal('Set Processing Fee', body, `<button class="btn btn-primary btn-sm" onclick="submitFee('${id}')">Save</button>`);
};
window.submitFee = async (id) => {
  const fee_amount = +qs('#fee-amount').value;
  if (!(fee_amount >= 0)) return toast('Enter a valid fee', true);
  try {
    await api(`/shul-payments/${id}/fee`, { method: 'PUT', body: { fee_amount } });
    toast('Fee updated');
    closeModal();
    loadPayments();
  } catch (err) { toast(err.message, true); }
};
window.deletePayment = async (id) => {
  if (!confirm('Delete this transaction? This removes it permanently, not as a reversal entry.')) return;
  try {
    await api(`/shul-payments/${id}`, { method: 'DELETE' });
    toast('Deleted');
    loadPayments();
  } catch (err) {
    if (err.data?.requiresUndoAll) {
      const names = err.data.activeAllocations.map(a => `${a.applicant_name || 'Unknown'} (${fmtMoney(a.total_amount)})`).join(', ');
      if (confirm(`${err.message}\n\nOutstanding: ${names}\n\nUndo all of these now (pulls money back off each applicant's card) and then delete this payment?`)) {
        try {
          await api(`/shul-payments/${id}`, { method: 'DELETE', body: { confirmUndoAll: true } });
          toast('Distributions undone and payment deleted');
          loadPayments();
        } catch (err2) { toast(err2.message, true); }
      }
      return;
    }
    toast(err.message, true);
  }
};
window.submitManualPayment = async () => {
  const shul_id = qs('#mp-shul').value, season_id = qs('#mp-season').value;
  if (!shul_id) return toast('Select a shul', true);
  if (!season_id) return toast('Select a season', true);
  const body = {
    shul_id, season_id, method: qs('#mp-method').value, amount: +qs('#mp-amount').value,
    manual_date: qs('#mp-date').value, manual_time: qs('#mp-time').value, manual_ref: qs('#mp-ref').value, notes: qs('#mp-notes').value,
  };
  try {
    await api('/shul-payments/manual', { method: 'POST', body });
    toast('Payment added');
    qs('#mp-amount').value = ''; qs('#mp-date').value = ''; qs('#mp-time').value = ''; qs('#mp-ref').value = ''; qs('#mp-notes').value = '';
    loadPayments();
  } catch (err) { toast(err.message, true); }
};
// Same light cosmetic formatting as the shul portal's own card form (see
// shul-portal/payments.html) — spaces every 4 digits, auto-inserts the "/"
// in MM/YY — both stripped back to plain digits before being sent.
qs('#ac-card-num')?.addEventListener('input', () => {
  const el = qs('#ac-card-num');
  el.value = el.value.replace(/[^\d ]/g, '').replace(/\s/g, '').replace(/(.{4})/g, '$1 ').trim();
});
qs('#ac-exp')?.addEventListener('input', () => {
  const el = qs('#ac-exp');
  let v = el.value.replace(/\D/g, '').slice(0, 4);
  if (v.length > 2) v = v.slice(0, 2) + '/' + v.slice(2);
  el.value = v;
});
let acMockMode = false;
async function loadAdminChargeConfig() {
  try {
    const cfg = await api('/shul-payments/config');
    acMockMode = !!cfg.mockMode;
    qs('#ac-mock-note').style.display = acMockMode ? 'block' : 'none';
  } catch { /* best-effort — the form still works, just without the mock-mode note */ }
}
// Card number/CVV are read straight from this page's own inputs and POSTed
// to this app's backend, which forwards them to Sola — no hosted iframe.
// Never logged. See services/sola.js for the PCI-scope tradeoff.
window.submitAdminCharge = async () => {
  const shul_id = qs('#ac-shul').value, season_id = qs('#ac-season').value;
  const amount = +qs('#ac-amount').value;
  const xCardNum = qs('#ac-card-num').value.replace(/\s/g, '');
  const xCVV = qs('#ac-cvv').value.trim();
  const xExp = qs('#ac-exp').value.replace(/\D/g, '');
  const xZip = qs('#ac-zip').value.trim();
  if (!shul_id) return toast('Select a shul', true);
  if (!season_id) return toast('Select a season', true);
  if (!(amount > 0)) { qs('#ac-status').textContent = 'Enter a valid amount'; return; }
  if (!acMockMode) {
    if (!xCardNum || !xCVV) { qs('#ac-status').textContent = 'Enter the card number and CVV'; return; }
    if (xExp.length !== 4) { qs('#ac-status').textContent = 'Enter the card expiration date (MM/YY)'; return; }
  }
  qs('#btn-ac').disabled = true;
  qs('#ac-status').textContent = '';
  try {
    const { mock } = await api('/shul-payments/admin-charge', { method: 'POST', body: { shul_id, season_id, amount, xCardNum, xCVV, xExp, xZip } });
    qs('#ac-status').textContent = mock ? 'Test mode: charge simulated.' : 'Charged and approved.';
    qs('#ac-amount').value = ''; qs('#ac-card-num').value = ''; qs('#ac-cvv').value = ''; qs('#ac-exp').value = ''; qs('#ac-zip').value = '';
    loadPayments();
  } catch (err) { qs('#ac-status').textContent = err.message; }
  qs('#btn-ac').disabled = false;
};
window.submitPayout = async () => {
  const shul_id = qs('#po-shul').value, season_id = qs('#po-season').value;
  if (!shul_id) return toast('Select a shul', true);
  if (!season_id) return toast('Select a season', true);
  const body = {
    shul_id, season_id, method: qs('#po-method').value, amount: +qs('#po-amount').value,
    manual_date: qs('#po-date').value, manual_time: qs('#po-time').value, manual_ref: qs('#po-ref').value, notes: qs('#po-notes').value,
  };
  try {
    await api('/shul-payments/payout', { method: 'POST', body });
    toast('Payout recorded');
    qs('#po-amount').value = ''; qs('#po-date').value = ''; qs('#po-time').value = ''; qs('#po-ref').value = ''; qs('#po-notes').value = '';
    loadPayments();
  } catch (err) { toast(err.message, true); }
};

async function loadAllocations() {
  const { allocations } = await api('/shul-payments/allocations?' + currentFilterParams());
  const active = allocations.filter(a => !a.reversed_at);
  qs('#tbody-allocations').innerHTML = active.length ? active.map(a => `<tr>
      <td>${esc(a.shul_name||'')}</td>
      <td>${esc(a.first_name||'')} ${esc(a.last_name||'')}${a.is_admin_override ? ' ' + badge('override','pending') : ''}</td>
      <td>${fmtMoney(a.base_amount)}</td><td>${fmtMoney(a.match_amount)}</td><td>${fmtMoney(a.total_amount)}</td>
      <td>${esc(a.created_by_first||'')} ${esc(a.created_by_last||'')}</td>
      <td>${fmtDateTime(a.created_at)}</td>
      <td><button class="btn btn-outline btn-sm" onclick="undoAllocation('${a.id}')">Undo</button></td>
    </tr>`).join('') : '<tr><td colspan="8" class="empty-state">No allocations match these filters.</td></tr>';
}
window.undoAllocation = async (id) => {
  if (!confirm('Undo this allocation? This pulls the money back off the applicant\'s card and restores the shul\'s balance. If some of it has already been spent, only what\'s left comes back — the rest is written off, not restored to the shul\'s balance.')) return;
  try {
    const { reversal } = await api(`/shul-payments/allocations/${id}/reverse`, { method: 'POST' });
    toast(...reversalToastMessage(reversal, 'Reversed'));
    loadAllocations();
  } catch (err) { toast(err.message, true); }
};
async function loadApplicantsForShul(shulId) {
  const sel = qs('#al-applicant');
  if (!shulId) { sel.innerHTML = '<option value="">Select a shul first…</option>'; return; }
  sel.innerHTML = '<option value="">Loading…</option>';
  try {
    const { applicants } = await api(`/applicants?shul_id=${encodeURIComponent(shulId)}&status=approved&pageSize=500`);
    const approved = applicants.filter(a => a.approval_status === 'approved');
    sel.innerHTML = approved.length
      ? '<option value="">Select an applicant…</option>' + approved.map(a => `<option value="${a.id}">${esc(a.first_name)} ${esc(a.last_name)}</option>`).join('')
      : '<option value="">No approved applicants for this shul</option>';
  } catch { sel.innerHTML = '<option value="">Could not load applicants</option>'; }
}
qs('#al-shul').addEventListener('change', () => loadApplicantsForShul(qs('#al-shul').value));
window.submitAdminAllocation = async () => {
  const shul_id = qs('#al-shul').value, applicant_id = qs('#al-applicant').value, amount = +qs('#al-amount').value;
  if (!shul_id) return toast('Select a shul', true);
  if (!applicant_id) return toast('Select an applicant', true);
  if (!(amount > 0)) return toast('Enter a valid amount', true);
  try {
    await api('/shul-payments/allocate', { method: 'POST', body: { shul_id, applicant_id, amount, is_admin_override: qs('#al-override').checked } });
    toast('Given');
    qs('#al-amount').value = ''; qs('#al-override').checked = false;
    loadAllocations();
  } catch (err) { toast(err.message, true); }
};

async function loadRequests() {
  const { requests } = await api('/shul-payments/method-requests');
  qs('#tbody-requests').innerHTML = requests.length ? requests.map(r => `<tr>
      <td>${esc(r.shul_name||'')}</td><td>${esc(r.requested_method||'')}</td><td>${esc(r.message||'')}</td><td>${fmtDateTime(r.created_at)}</td>
    </tr>`).join('') : '<tr><td colspan="4" class="empty-state">No requests yet.</td></tr>';
}

// Shul Totals: a small, full (unpaginated) list — one row per shul, not per
// transaction — so search/sort happens entirely client-side against the
// one fetched array, same pattern as the Donor Dashboard's expandable
// panels, rather than round-tripping to the server per keystroke/sort click.
let shulTotalsRows = [], shulTotalsSort = { key: 'totalPaid', dir: 'DESC' };
async function loadShulTotals() {
  const { shuls } = await api('/shul-payments/shul-totals');
  shulTotalsRows = shuls;
  renderShulTotals();
}
function renderShulTotals() {
  const q = qs('#st-search').value.trim().toLowerCase();
  let rows = !q ? shulTotalsRows : shulTotalsRows.filter(s =>
    (s.nameEn || '').toLowerCase().includes(q) || (s.nameHe || '').includes(q));
  const { key, dir } = shulTotalsSort;
  rows = [...rows].sort((a, b) => {
    const av = a[key], bv = b[key];
    const cmp = typeof av === 'number' ? av - bv : String(av || '').localeCompare(String(bv || ''));
    return dir === 'ASC' ? cmp : -cmp;
  });
  qs('#tbody-shultotals').innerHTML = rows.length ? rows.map(s => `<tr>
      <td>${esc(s.nameEn || '')}</td><td dir="rtl">${esc(s.nameHe || '')}</td><td>${fmtMoney(s.totalPaid)}</td>
    </tr>`).join('') : '<tr><td colspan="3" class="empty-state">No shuls match.</td></tr>';
}
qs('#st-search').addEventListener('input', renderShulTotals);
qs('#panel-shultotals').querySelector('thead').addEventListener('click', (e) => {
  const th = e.target.closest('th[data-sort]');
  if (!th) return;
  const key = th.dataset.sort;
  shulTotalsSort.dir = (shulTotalsSort.key === key && shulTotalsSort.dir === 'DESC') ? 'ASC' : 'DESC';
  shulTotalsSort.key = key;
  renderShulTotals();
});

const TABS = ['payments', 'allocations', 'requests', 'shultotals'];
const TAB_LOADERS = { payments: loadPayments, allocations: loadAllocations, requests: loadRequests, shultotals: loadShulTotals };
function switchTab(t) {
  activeTab = t;
  TABS.forEach(x => { qs('#tab-' + x + '-btn').classList.toggle('active', x === t); qs('#panel-' + x).style.display = x === t ? 'block' : 'none'; });
  qs('#f-status').style.display = t === 'payments' ? '' : 'none';
  // Shul Totals is a lifetime, all-seasons rollup with its own search box —
  // the shul/season filters above the tabs don't apply to it.
  qs('#f-shul').style.display = t === 'shultotals' ? 'none' : '';
  qs('#f-season').style.display = t === 'shultotals' ? 'none' : '';
  TAB_LOADERS[t]();
}
TABS.forEach(t => qs('#tab-' + t + '-btn').addEventListener('click', () => switchTab(t)));

qs('#f-shul').addEventListener('change', () => { state.shul_id = qs('#f-shul').value; TAB_LOADERS[activeTab](); });
qs('#f-season').addEventListener('change', () => { state.season_id = qs('#f-season').value; populateShulFilter('f-shul', state.season_id); TAB_LOADERS[activeTab](); });
qs('#f-status').addEventListener('change', () => { state.status = qs('#f-status').value; TAB_LOADERS[activeTab](); });

// Loaded first so the Payments table's very first render already has real
// (possibly admin-renamed) method labels instead of the fallback defaults.
loadMethodOptions().then(() => {
  populateSeasonFilter('f-season').then(activeId => {
    state.season_id = activeId;
    populateShulFilter('f-shul', activeId);
    loadPayments();
  });
});
// The manual-payment / allocate forms' own shul dropdowns are deliberately
// NOT scoped to the season filter above (an admin might be entering a
// payment for a season other than whatever's currently being browsed), so
// they get their own unscoped shul list plus a season picker of their own.
// populateShulFilter() labels its blank option "All Shuls" (right for a list
// filter, wrong for a required single pick here), so these two are filled
// directly instead.
async function populateShulPicker(selectId) {
  try {
    const { shuls } = await api('/shuls/all-list');
    qs('#' + selectId).innerHTML = '<option value="">Select a shul…</option>' + shuls.map(s => `<option value="${s.id}">${esc(s.name_en)}</option>`).join('');
  } catch { /* leave the placeholder if this fails to load */ }
}
populateShulPicker('mp-shul');
populateSeasonFilter('mp-season');
populateShulPicker('po-shul');
populateSeasonFilter('po-season');
populateShulPicker('ac-shul');
populateSeasonFilter('ac-season');
loadAdminChargeConfig();
populateShulPicker('al-shul');
loadRequests();
</script>
</body>
</html>
