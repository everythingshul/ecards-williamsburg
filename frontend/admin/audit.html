<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logs · Kupes Hair Williamsburg</title>
<link rel="stylesheet" href="/css/theme.css">
<link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="stylesheet" href="/css/portal-theme.css">
</head>
<body>
<script src="/js/app.js"></script>
<script>
Auth.requireRole('super_admin');
// Hardcoded super_admin-only, not a permissions check — 'audit' isn't a
// grantable resource at all (see middleware/permissions.js), so someone
// without the role can't reach this page directly by URL either. The
// actual API (routes/audit.js) independently re-checks the same way.
renderShell('/admin/audit', `
  <h2>Logs</h2>
  <div class="tabs">
    <button class="active" id="tab-actions-btn">Actions</button>
    <button id="tab-apirequests-btn">API Requests</button>
    <button id="tab-providercalls-btn">Provider Calls</button>
  </div>
  <div id="panel-actions">
    <div class="flex-between">
      <p class="small-muted" style="margin:0">Every create/update/approve/reject across the system, who did it, and what changed. Undoing restores exactly the fields that action changed; an undone action shows a Redo button to bring it back.</p>
      <select id="f-hours">
        <option value="24">Last 24 hours</option>
        <option value="48" selected>Last 48 hours</option>
        <option value="168">Last 7 days</option>
        <option value="720">Last 30 days</option>
      </select>
    </div>
    <div id="actions-list">Loading…</div>
  </div>
  <div id="panel-apirequests" style="display:none">
    <p class="small-muted">Every request this app's own API received — method, path, status, timing, and who made it (blank when unauthenticated). Never includes request/response bodies — no card numbers, passwords, or other submitted data are ever logged here. Rows older than 30 days are pruned automatically.</p>
    <div class="toolbar">
      <select id="al-method"><option value="">All Methods</option><option value="GET">GET</option><option value="POST">POST</option><option value="PUT">PUT</option><option value="DELETE">DELETE</option></select>
      <input id="al-path" placeholder="Path contains…" style="max-width:220px">
      <select id="al-status"><option value="">All Statuses</option><option value="200">200</option><option value="201">201</option><option value="400">400</option><option value="401">401</option><option value="403">403</option><option value="404">404</option><option value="500">500</option></select>
      <select id="al-hours">
        <option value="1">Last hour</option>
        <option value="24" selected>Last 24 hours</option>
        <option value="168">Last 7 days</option>
        <option value="720">Last 30 days</option>
      </select>
      <select id="al-limit" title="How many of the most recent matching requests to show">
        <option value="500">500 rows</option>
        <option value="2000" selected>2,000 rows</option>
        <option value="5000">5,000 rows</option>
        <option value="10000">10,000 rows</option>
      </select>
      <button class="btn btn-outline btn-sm" onclick="loadApiRequests()">Filter</button>
      <button class="btn btn-outline btn-sm" onclick="downloadAuthed('/logs/export?' + apiRequestParams(), 'api-logs.xlsx')">Export</button>
    </div>
    <p class="small-muted" id="al-count-note">Showing the most recent matching requests, newest first — raise the row count, narrow the filters, or use Export for a full range.</p>
    <div class="card" style="padding:0;overflow-x:auto">
      <table><thead><tr><th>Time</th><th>Method</th><th>Path</th><th>Status</th><th>Duration</th><th>User</th><th>IP</th></tr></thead>
      <tbody id="tbody-apirequests"><tr><td colspan="7" class="empty-state">Loading…</td></tr></tbody></table>
    </div>
  </div>
  <div id="panel-providercalls" style="display:none">
    <p class="small-muted">Every outbound HTTP request this app made to a third-party provider (disccardpromos, email, SMS) — the reverse of API Requests above. This is where a batching fix like "one bulk pull instead of one call per applicant" is visible: filter to disccardpromos during a mass-approve or the automatic sync and count the calls. Never includes API keys or full card numbers. Rows older than 30 days are pruned automatically.</p>
    <div class="toolbar">
      <select id="pc-provider"><option value="">All Providers</option><option value="disccardpromos">disccardpromos</option><option value="email">Email</option><option value="sms">SMS</option></select>
      <select id="pc-success"><option value="">All Results</option><option value="1">Success</option><option value="0">Failed</option></select>
      <input id="pc-search" placeholder="Search endpoint/response/error…" style="max-width:240px">
      <select id="pc-hours">
        <option value="1">Last hour</option>
        <option value="24" selected>Last 24 hours</option>
        <option value="168">Last 7 days</option>
        <option value="720">Last 30 days</option>
      </select>
      <select id="pc-limit" title="How many of the most recent matching calls to show">
        <option value="500">500 rows</option>
        <option value="2000" selected>2,000 rows</option>
        <option value="5000">5,000 rows</option>
        <option value="10000">10,000 rows</option>
      </select>
      <button class="btn btn-outline btn-sm" onclick="loadProviderCalls()">Filter</button>
    </div>
    <p class="small-muted" id="pc-count-note">Showing the most recent matching calls, newest first — raise the row count or narrow the filters as needed.</p>
    <div class="card" style="padding:0;overflow-x:auto">
      <table><thead><tr><th>Time</th><th>Provider</th><th>Method</th><th>Endpoint</th><th>Status</th><th>Duration</th><th>Result</th></tr></thead>
      <tbody id="tbody-providercalls"><tr><td colspan="7" class="empty-state">Loading…</td></tr></tbody></table>
    </div>
  </div>
`);

const ENTITY_LABELS = { shul: 'shul', applicant: 'applicant', store: 'store', season: 'season', task: 'task', user: 'user', card: 'card', shul_allocation: 'allocation' };
const ACTION_VERBS = { create: 'Created', update: 'Updated', delete: 'Deleted', approve: 'Approved', reject: 'Rejected', undo: 'Reversed a change to', login: 'Signed in', esign: 'Signed', send_contract: 'Sent a contract to', retract_signature: 'Retracted a signature on', resolve_duplicate: 'Resolved a duplicate flag on', impersonate: 'Entered the portal as' };
// Mass actions (bulk buttons + spreadsheet imports) log one audit_log row
// per click/upload instead of one per affected record — entity_id is null,
// and the record ids/names/counts live in after_json instead of a normal
// before/after diff. Rendered with their own headline/detail below rather
// than forced through headline()/changeList(), which assume a single entity.
const MASS_VERBS = { 'mass-approve': 'Approved', 'mass-reject': 'Rejected', 'mass-set-pending': 'Set to pending', 'mass-delete': 'Deleted', 'mass-delete-undo': 'Restored', 'mass-import': 'Imported', 'mass-set-status': 'Updated status for', 'mass-deactivate': 'Deactivated', 'mass-activate': 'Activated' };
const FIELD_LABELS = {
  approval_status: 'Status', card_amount: 'Card Amount', is_active: 'Active', first_name: 'First Name', last_name: 'Last Name',
  name_en: 'Name', name: 'Name', role: 'Role', phone: 'Phone', slots_allocated: 'Slots', email: 'Email', home_phone: 'Home Phone',
  husband_cell: 'Husband Cell', wife_cell: 'Wife Cell', address: 'Address', city: 'City', state: 'State', zip: 'Zip',
  marital_status: 'Marital Status', num_children: 'Children', home_for_yomtov: 'Home for Yom Tov', comments: 'Comments',
  visibility: 'Visibility', opens_at: 'Opens', closes_at: 'Closes', setup_status: 'Setup Status', manager_name: 'Manager Name',
  manager_phone: 'Manager Phone', manager_email: 'Manager Email', owner_name: 'Owner Name', owner_phone: 'Owner Phone', owner_email: 'Owner Email',
};
// Turns an unmapped snake_case column name into a readable label as a
// fallback, rather than showing the raw db column name.
function fieldLabel(k) { return FIELD_LABELS[k] || k.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase()); }
const DATE_FIELDS = new Set(['opens_at', 'closes_at']);
function fmtVal(k, v) {
  if (v === null || v === undefined || v === '') return '—';
  if (typeof v === 'number' && (v === 0 || v === 1) && ['is_active', 'home_for_yomtov'].includes(k)) return v ? 'Yes' : 'No';
  if (DATE_FIELDS.has(k)) return fmtDateTime(v);
  if (k === 'card_amount') return fmtMoney(v);
  return String(v);
}
// Best-effort human name for whichever entity this action touched, so the
// headline reads "Updated shul — Congregation Beth Israel" instead of a
// bare entity type + id.
function entityName(row) {
  let r = row.after || row.before;
  // A hard-delete's before/after carries a full cascade snapshot (see
  // utils/entityDelete.js), not a flat row — {kind, row, ...} — so unwrap
  // to the actual entity row before reading name fields off of it.
  if (r && r.kind && r.row) r = r.row;
  if (!r) return '';
  return r.name_en || r.name || `${r.first_name || ''} ${r.last_name || ''}`.trim() || r.email || '';
}

// One clear headline per action, then (for actions with a real before/after
// diff) a short field-by-field list underneath — one field per line, plain
// labels, formatted values — instead of a single comma-packed "→" dump.
function headline(a) {
  if (a.action === 'login') return 'Signed in';
  if (a.entity_type === 'shul_allocation') {
    const snap = a.after || a.before || {};
    const shul = a.allocationShulName ? esc(a.allocationShulName) : 'A shul';
    const applicant = a.allocationApplicantName ? esc(a.allocationApplicantName) : 'an applicant';
    if (a.action === 'undo') return `${shul} — allocation to ${applicant} reversed (${fmtMoney(Math.abs(snap.base_amount || 0))})`;
    const match = snap.match_amount ? ` (+${fmtMoney(snap.match_amount)} match)` : '';
    return `${shul} gave ${fmtMoney(snap.base_amount || 0)} to ${applicant}${match}${snap.is_admin_override ? ' — admin override' : ''}`;
  }
  const verb = ACTION_VERBS[a.action] || (a.action.charAt(0).toUpperCase() + a.action.slice(1));
  const label = ENTITY_LABELS[a.entity_type] || a.entity_type;
  const name = entityName(a);
  return `${verb} ${label}${name ? ' — ' + esc(name) : ''}`;
}
function changeList(a) {
  if (['create', 'delete', 'login'].includes(a.action)) return '';
  // The 'undo' row's before/after are two different shul_allocations rows
  // (the original and its equal-and-opposite reversal), not a field-level
  // diff of one record — a generic before→after list would be meaningless.
  if (a.entity_type === 'shul_allocation') return '';
  const before = a.before || {}, after = a.after || {};
  const keys = [...new Set([...Object.keys(before), ...Object.keys(after)])].filter(k => JSON.stringify(before[k]) !== JSON.stringify(after[k]));
  if (!keys.length) return '';
  return `<ul style="margin:8px 0 0;padding-left:18px;font-size:13px;color:var(--text-muted)">
    ${keys.map(k => `<li><strong style="color:var(--text-dark)">${esc(fieldLabel(k))}:</strong> ${esc(fmtVal(k, before[k]))} <span style="color:var(--brand-gold-dark)">→</span> ${esc(fmtVal(k, after[k]))}</li>`).join('')}
  </ul>`;
}

// One row for an entire bulk action instead of the per-field diff a
// single-entity row gets — there's no one "before" to show, just how many
// records were touched, how many were skipped, and (when the backend sent
// them) which ones by name.
function massHeadline(a) {
  const label = ENTITY_LABELS[a.entity_type] || a.entity_type;
  const after = a.after || {};
  if (a.action === 'mass-import') {
    const created = after.created || 0, updated = after.updated || 0, total = created + updated;
    const plural = total === 1 ? label : label + 's';
    const parts = [];
    if (created) parts.push(`${created} created`);
    if (updated) parts.push(`${updated} updated`);
    return `Imported ${total} ${plural}${parts.length ? ' — ' + parts.join(', ') : ''}`;
  }
  if (a.action === 'mass-import-undo') {
    const deleted = after.deletedCreated || 0, restored = after.restoredUpdated || 0, unrestorable = after.unrestorableUpdated || 0;
    const parts = [];
    if (deleted) parts.push(`${deleted} created ${deleted === 1 ? 'record' : 'records'} deleted`);
    if (restored) parts.push(`${restored} updated ${restored === 1 ? 'record' : 'records'} restored`);
    if (unrestorable) parts.push(`${unrestorable} older ${unrestorable === 1 ? 'update' : 'updates'} couldn't be reverted`);
    return `Reversed an import${parts.length ? ' — ' + parts.join(', ') : ''}`;
  }
  const verb = MASS_VERBS[a.action] || (a.action.replace(/^mass-/, '').replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase()));
  const count = after.count || 0;
  return `${verb} ${count} ${count === 1 ? label : label + 's'}`;
}
function massDetail(a) {
  const after = a.after || {};
  const bits = [];
  if (after.skipped) bits.push(`${after.skipped} skipped`);
  if (after.duplicates) bits.push(`${after.duplicates} flagged as duplicates`);
  if (after.errors) bits.push(`${after.errors} errors`);
  if (after.capReached) bits.push('season cap reached');
  if (after.providerErrors) bits.push(`${after.providerErrors} gift-card provider errors`);
  if (after.zeroAmountSkipped) bits.push(`${after.zeroAmountSkipped} had a $0 card amount, nothing sent to disccardpromos`);
  if (after.emailErrors) bits.push(`${after.emailErrors} email errors`);
  if (after.cardLockErrors) bits.push(`${after.cardLockErrors} card-lock errors`);
  let html = bits.length ? `<div class="small-muted" style="margin-top:6px">${esc(bits.join(' · '))}</div>` : '';
  // Real per-applicant reasons for the gift-card provider errors counted
  // above — see routes/applicants.js's mass-approve for why this exists
  // (a bare count alone gave no way to tell "not configured" apart from a
  // genuine disccardpromos rejection).
  const providerErrorDetails = (after.providerErrorDetails || []).filter(Boolean);
  if (providerErrorDetails.length) {
    html += `<div class="small-muted" style="margin-top:4px;color:var(--danger)">${providerErrorDetails.map(d => esc(d)).join('<br>')}</div>`;
  }
  const names = (after.names || []).filter(Boolean);
  if (names.length) {
    const shown = names.slice(0, 15).join(', ');
    html += `<div class="small-muted" style="margin-top:4px">${esc(shown)}${names.length > 15 ? esc(`, +${names.length - 15} more`) : ''}</div>`;
  }
  return html;
}

async function load() {
  const hours = qs('#f-hours').value;
  const { actions } = await api(`/audit/recent?hours=${hours}`);
  qs('#actions-list').innerHTML = actions.length ? actions.map(a => {
    const isMass = a.action.startsWith('mass-');
    return `<div class="card" style="margin-bottom:8px;padding:14px 16px">
      <div class="flex-between">
        <div>
          <strong>${isMass ? esc(massHeadline(a)) : headline(a)}</strong>${a.undone_at ? ' ' + badge('undone', 'inactive') : ''}
          ${isMass ? massDetail(a) : changeList(a)}
          <div class="small-muted" style="margin-top:8px">${a.user_id ? esc((a.first_name||'')+' '+(a.last_name||'')).trim() || esc(a.user_email) : 'System'} · ${fmtDateTime(a.created_at)}</div>
        </div>
        ${a.undoable ? `<button class="btn btn-sm btn-outline" onclick="undoAction('${a.id}', false, '${a.action}')">Undo</button>` : ''}
        ${a.redoable ? `<button class="btn btn-sm btn-outline" onclick="undoAction('${a.undo_entry_id}', true)">Redo</button>` : ''}
        ${a.allocationReversible ? `<button class="btn btn-sm btn-outline" onclick="reverseShulAllocation('${a.entity_id}')">Undo</button>` : ''}
      </div>
    </div>`;
  }).join('') : '<p class="small-muted">No actions in this window.</p>';
}
window.undoAction = async (id, isRedo, action) => {
  // Undoing a mass import is more consequential than a normal single-entity
  // undo — it permanently deletes every record the import created (not a
  // reversible "restore," a real delete) and, when the row has the data for
  // it, restores edited records to their prior values. There's also no
  // Redo afterward (see services/audit.js undoMassImportEntry), so the
  // generic "this restores..." wording undersells what's about to happen.
  const message = action === 'mass-import'
    ? 'Undo this import? Every record it CREATED will be permanently deleted, and any records it UPDATED will be restored to their previous values where possible. This cannot be redone afterward.'
    : (isRedo ? 'Redo this action? This brings the change back.' : 'Undo this action? This restores the affected record to how it was right before this change.');
  if (!confirm(message)) return;
  try { await api(`/audit/${id}/undo`, { method: 'POST' }); toast(isRedo ? 'Redone' : 'Undone'); load(); } catch (err) { toast(err.message, true); }
};
// Deliberately NOT routed through undoAction()/POST /audit/:id/undo — a
// shul_allocation isn't in ENTITY_TABLES, so the generic column-restore undo
// can't handle it. It has its own money-aware reversal (checks the
// applicant's live card balance via disccardpromos and only pulls back
// whatever's still there, writing off the rest — see services/matching.js
// reverseAllocation) already wired up for the admin
// Shuls > Payments tab; this just gives the Actions tab a button to the
// same endpoint instead of duplicating that logic.
window.reverseShulAllocation = async (allocationId) => {
  if (!confirm("Undo this allocation? This pulls the money back off the applicant's card and restores the shul's balance. If some of it has already been spent, only what's left comes back — the rest is written off, not restored to the shul's balance.")) return;
  try {
    const { reversal } = await api(`/shul-payments/allocations/${allocationId}/reverse`, { method: 'POST' });
    toast(...reversalToastMessage(reversal, 'Undone'));
    load();
  } catch (err) { toast(err.message, true); }
};
qs('#f-hours').addEventListener('change', load);
load();

// ============================= API Requests tab =============================
function apiRequestParams() {
  const p = {};
  const method = qs('#al-method').value, status = qs('#al-status').value, path = qs('#al-path').value.trim(), hours = qs('#al-hours').value, limit = qs('#al-limit').value;
  if (method) p.method = method;
  if (status) p.status = status;
  if (path) p.path = path;
  if (hours) p.hours = hours;
  if (limit) p.limit = limit;
  return new URLSearchParams(p).toString();
}
window.loadApiRequests = async () => {
  qs('#tbody-apirequests').innerHTML = '<tr><td colspan="7" class="empty-state">Loading…</td></tr>';
  try {
    const { logs } = await api('/logs?' + apiRequestParams());
    const cap = +qs('#al-limit').value;
    qs('#al-count-note').textContent = logs.length >= cap
      ? `Showing the ${cap.toLocaleString()} most recent matching requests — there are more; raise the row count, narrow the filters, or use Export for the full range.`
      : `Showing all ${logs.length.toLocaleString()} matching request${logs.length === 1 ? '' : 's'} in this window, newest first.`;
    qs('#tbody-apirequests').innerHTML = logs.length ? logs.map(l => `<tr>
      <td>${fmtDateTime(l.created_at)}</td>
      <td>${esc(l.method)}</td>
      <td style="max-width:320px;overflow-wrap:anywhere">${esc(l.path)}</td>
      <td>${badge(String(l.status_code), l.status_code >= 500 ? 'rejected' : (l.status_code >= 400 ? 'pending' : 'active'))}</td>
      <td>${l.duration_ms != null ? l.duration_ms + ' ms' : '—'}</td>
      <td>${esc(l.user_email || 'Unauthenticated')}${l.user_role ? `<div class="small-muted">${esc(l.user_role)}</div>` : ''}</td>
      <td>${esc(l.ip_address || '')}</td>
    </tr>`).join('') : '<tr><td colspan="7" class="empty-state">No requests match these filters.</td></tr>';
  } catch (err) { qs('#tbody-apirequests').innerHTML = `<tr><td colspan="7" class="empty-state">${esc(err.message)}</td></tr>`; }
};

// ============================= Provider Calls tab =============================
let providerCallRows = [];
function providerCallParams() {
  const p = {};
  const provider = qs('#pc-provider').value, success = qs('#pc-success').value, search = qs('#pc-search').value.trim(), hours = qs('#pc-hours').value, limit = qs('#pc-limit').value;
  if (provider) p.provider = provider;
  if (success !== '') p.success = success;
  if (search) p.search = search;
  if (hours) p.hours = hours;
  if (limit) p.limit = limit;
  return new URLSearchParams(p).toString();
}
window.loadProviderCalls = async () => {
  qs('#tbody-providercalls').innerHTML = '<tr><td colspan="7" class="empty-state">Loading…</td></tr>';
  try {
    const { logs } = await api('/audit/provider-calls?' + providerCallParams());
    providerCallRows = logs;
    const cap = +qs('#pc-limit').value;
    qs('#pc-count-note').textContent = logs.length >= cap
      ? `Showing the ${cap.toLocaleString()} most recent matching calls — there are more; raise the row count or narrow the filters to see the rest.`
      : `Showing all ${logs.length.toLocaleString()} matching call${logs.length === 1 ? '' : 's'} in this window, newest first.`;
    qs('#tbody-providercalls').innerHTML = logs.length ? logs.map((l, i) => `<tr style="cursor:pointer" onclick="showProviderCallDetail(${i})">
      <td>${fmtDateTime(l.created_at)}</td>
      <td>${esc(l.provider)}</td>
      <td>${esc(l.method)}</td>
      <td style="max-width:320px;overflow-wrap:anywhere">${esc(l.endpoint)}</td>
      <td>${l.status_code != null ? badge(String(l.status_code), l.status_code >= 400 ? 'rejected' : 'active') : '—'}</td>
      <td>${l.duration_ms != null ? l.duration_ms + ' ms' : '—'}</td>
      <td>${l.success ? badge('success', 'active') : badge('failed', 'rejected')}</td>
    </tr>`).join('') : '<tr><td colspan="7" class="empty-state">No provider calls match these filters.</td></tr>';
  } catch (err) { qs('#tbody-providercalls').innerHTML = `<tr><td colspan="7" class="empty-state">${esc(err.message)}</td></tr>`; }
};
window.showProviderCallDetail = (i) => {
  const l = providerCallRows[i];
  if (!l) return;
  const body = `
    <p><strong>${esc(l.method)} ${esc(l.endpoint)}</strong></p>
    <p class="small-muted">${fmtDateTime(l.created_at)} · ${l.status_code ?? '—'} · ${l.duration_ms != null ? l.duration_ms + ' ms' : '—'} · ${l.success ? 'Success' : 'Failed'}</p>
    ${l.request_summary ? `<p><strong>Request:</strong></p><pre style="max-height:40vh;overflow:auto;white-space:pre-wrap;word-break:break-word;font-size:12px;background:var(--brand-panel-2);padding:10px;border-radius:6px">${esc(l.request_summary)}</pre>` : ''}
    ${l.response_summary ? `<p><strong>Response:</strong></p><pre style="max-height:40vh;overflow:auto;white-space:pre-wrap;word-break:break-word;font-size:12px;background:var(--brand-panel-2);padding:10px;border-radius:6px">${esc(l.response_summary)}</pre>` : ''}
    ${l.error_message ? `<p style="color:var(--danger)"><strong>Error:</strong> ${esc(l.error_message)}</p>` : ''}
  `;
  openModal(`${l.provider} call`, body, '', { wide: true });
};

const LOG_TABS = ['actions', 'apirequests', 'providercalls'];
function switchLogTab(t) {
  LOG_TABS.forEach(x => { qs('#tab-' + x + '-btn').classList.toggle('active', x === t); qs('#panel-' + x).style.display = x === t ? 'block' : 'none'; });
  if (t === 'apirequests') loadApiRequests();
  if (t === 'providercalls') loadProviderCalls();
}
LOG_TABS.forEach(t => qs('#tab-' + t + '-btn').addEventListener('click', () => switchLogTab(t)));
</script>
</body>
</html>
