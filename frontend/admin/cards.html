<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cards & Transactions · Kupes Hair Williamsburg</title>
<link rel="stylesheet" href="/css/theme.css">
<link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="stylesheet" href="/css/portal-theme.css">
</head>
<body>
<script src="/js/app.js?v=20261017"></script>
<script>
Auth.requireAdmin();
renderShell('/admin/cards', `
  <div class="flex-between"><h2>Cards & Transactions</h2><div class="pill-row"><button class="btn btn-outline btn-sm" id="btn-sync-all">Sync All Now</button><button class="btn btn-outline btn-sm" id="btn-spend-audit">Spend Audit</button><button class="btn btn-outline btn-sm" id="btn-export-cards">Export Cards CSV</button><button class="btn btn-outline btn-sm" id="btn-export-txns">Export Transactions CSV</button></div></div>
  <p class="small-muted">Cards auto-sync with disccardpromos every 60 seconds in the background. Use Sync All Now for an immediate refresh.</p>
  <div id="mock-banner"></div>
  <div class="tabs"><button class="active" id="tab-cards-btn">Cards</button><button id="tab-txns-btn">All Transactions</button><button id="tab-byshul-btn">Spent by Shul</button><button id="tab-recon-btn">Balance Mismatches<span id="recon-badge"></span></button></div>
  <div id="panel-cards">
    <div class="toolbar"><input id="f-search" placeholder="Search applicant name or card number…"><select id="f-status"><option value="">All statuses</option><option value="unassigned">Unassigned</option><option value="assigned">Assigned</option><option value="activated">Activated</option><option value="deactivated">Deactivated</option></select><select id="f-pagesize"><option value="25">25 / page</option><option value="50">50 / page</option><option value="100">100 / page</option><option value="200">200 / page</option></select></div>
    <div class="card" style="padding:0;overflow-x:auto">
      <table><thead><tr><th>Applicant</th><th>Shul</th><th>Card #</th><th>Status</th><th>Amount</th><th>Activated</th><th></th></tr></thead>
      <tbody id="tbody-cards"><tr><td colspan="7" class="empty-state">Loading…</td></tr></tbody></table>
    </div>
    <div class="paginator" id="pager-cards"></div>
  </div>
  <div id="panel-txns" style="display:none">
    <div class="card" id="txn-summary" style="margin-bottom:12px"></div>
    <div class="card" style="padding:0;overflow-x:auto">
      <table><thead><tr><th>Date</th><th>Applicant</th><th>Card #</th><th>Type</th><th>Amount</th><th>Store</th></tr></thead>
      <tbody id="tbody-txns"><tr><td colspan="6" class="empty-state">Loading…</td></tr></tbody></table>
    </div>
    <div class="paginator" id="pager-txns"></div>
  </div>
  <div id="panel-byshul" style="display:none">
    <p class="small-muted">Money loaded onto each shul's applicants' cards, and how much of it has been spent in stores so far. "Allocated" is everything loaded onto that shul's applicants — each approved applicant's card amount plus every give (shul money + match), undone gives netted out — the same per-applicant figure the Dashboard's "Total Loaded" sums org-wide. Counted once per applicant regardless of how many card rows they hold, so a replaced card or two cards sharing one disccardpromos account never double-counts them.</p>
    <div class="card" style="padding:0;overflow-x:auto">
      <table><thead><tr><th>Shul</th><th>Allocated</th><th>Spent</th><th>Remaining</th><th></th></tr></thead>
      <tbody id="tbody-byshul"><tr><td colspan="5" class="empty-state">Loading…</td></tr></tbody></table>
    </div>
  </div>
  <div id="panel-recon" style="display:none">
    <p class="small-muted">An applicant whose real disccardpromos balance is HIGHER than what our own ledger ever loaded onto their card — checked automatically on every sync. This never fires just because real spend has reduced the balance below our ledger (this app can't confirm individual store transactions yet, so that's expected, not a mismatch) — only money showing up that we never put there. "Fix on disccardpromos" pushes our ledger's number to disccardpromos, actually correcting the real balance (not just dismissing the flag); "Mark Resolved" only clears the flag without changing anything.</p>
    <div class="pill-row" style="margin-bottom:10px"><button class="btn btn-sm btn-primary" id="btn-fix-all-recon">Fix All on disccardpromos</button></div>
    <div class="card" style="padding:0;overflow-x:auto">
      <table><thead><tr><th>Applicant</th><th>Our Ledger</th><th>disccardpromos</th><th>Difference</th><th>Detected</th><th></th></tr></thead>
      <tbody id="tbody-recon"><tr><td colspan="6" class="empty-state">Loading…</td></tr></tbody></table>
    </div>
  </div>
`);

let state = { search:'', status:'', page:1, pageSize:Auth.pageSize('cards') };
let txnPage = 1;

const cardsTabs = ['cards', 'txns', 'byshul', 'recon'];
function showCardsTab(name) {
  cardsTabs.forEach(t => { qs('#tab-'+t+'-btn').classList.toggle('active', t === name); qs('#panel-'+t).style.display = t === name ? 'block' : 'none'; });
  if (name === 'txns') loadTxns();
  if (name === 'byshul') loadByShul();
  if (name === 'recon') loadReconFlags();
}
qs('#tab-cards-btn').addEventListener('click', () => showCardsTab('cards'));
qs('#tab-txns-btn').addEventListener('click', () => showCardsTab('txns'));
qs('#tab-byshul-btn').addEventListener('click', () => showCardsTab('byshul'));
qs('#tab-recon-btn').addEventListener('click', () => showCardsTab('recon'));

async function loadReconFlags() {
  let flags = [];
  try { ({ flags } = await api('/cards/reconciliation-flags')); } catch (err) { return toast(err.message, true); }
  qs('#recon-badge').innerHTML = flags.length ? ' ' + badge(String(flags.length), 'rejected') : '';
  qs('#tbody-recon').innerHTML = flags.length ? flags.map(f => `<tr>
      <td>${esc(f.first_name || '')} ${esc(f.last_name || '')}<br><span class="small-muted">ID ${esc(f.external_id || '')}</span></td>
      <td>${fmtMoney(f.expected_amount)}</td>
      <td>${fmtMoney(f.actual_amount)}</td>
      <td>${fmtMoney(f.actual_amount - f.expected_amount)}</td>
      <td>${fmtDateTime(f.detected_at)}</td>
      <td><button class="btn btn-sm btn-primary" onclick="fixReconFlag('${f.id}')">Fix on disccardpromos</button> <button class="btn btn-sm btn-outline" onclick="resolveReconFlag('${f.id}')">Mark Resolved</button></td>
    </tr>`).join('') : '<tr><td colspan="6" class="empty-state">No mismatches — everything matches disccardpromos.</td></tr>';
}
window.fixReconFlag = async (id) => {
  if (!confirm("Push our ledger's number to disccardpromos for this applicant? This actually changes their real balance there to match what our own records say it should be.")) return;
  try {
    const { pushedAmount } = await api(`/cards/reconciliation-flags/${id}/fix`, { method: 'POST' });
    toast(`Fixed — disccardpromos now shows ${fmtMoney(pushedAmount)}`);
    loadReconFlags();
  } catch (err) { toast(err.message, true); }
};
window.resolveReconFlag = async (id) => {
  if (!confirm('Mark this mismatch as resolved? This only clears the flag — it never changes any balance.')) return;
  try { await api(`/cards/reconciliation-flags/${id}/resolve`, { method: 'POST' }); toast('Resolved'); loadReconFlags(); } catch (err) { toast(err.message, true); }
};
qs('#btn-fix-all-recon').addEventListener('click', async () => {
  if (!confirm("Push our ledger's number to disccardpromos for EVERY currently-flagged applicant? This actually changes their real balances there to match what our own records say they should be.")) return;
  try {
    const { total, fixed, failures } = await api('/cards/reconciliation-flags/fix-all', { method: 'POST' });
    toast(!total ? 'Nothing to fix' : `Fixed ${fixed} of ${total}${failures.length ? ` — ${failures.length} failed: ${failures.map(f => `${f.name} (${f.error})`).join('; ')}` : ''}`, failures.length > 0);
    loadReconFlags();
  } catch (err) { toast(err.message, true); }
});
// Quiet initial check so the badge count shows up without needing to click
// into the tab first — same "surface it, don't bury it" reasoning as every
// other pending-count badge in this app.
loadReconFlags();
qs('#btn-export-cards').addEventListener('click', () => downloadAuthed('/cards/export?' + new URLSearchParams({ search: state.search, status: state.status }), 'cards.xlsx'));
// Spend Audit: reconciles disccardpromos' live per-customer data against what
// is stored here and says exactly where any gap in Total Spent comes from.
qs('#btn-spend-audit').addEventListener('click', async () => {
  const btn = qs('#btn-spend-audit'); btn.disabled = true; btn.textContent = 'Auditing…';
  try {
    const r = await api('/cards/spend-audit');
    if (r.mock) return toast(r.message, true);
    const s = r.summary, m = fmtMoney;
    const line = (label, val, note = '') => `<tr><td>${label}${note ? `<div class="small-muted">${note}</div>` : ''}</td><td style="text-align:right;white-space:nowrap"><strong>${val}</strong></td></tr>`;
    const gap = s.missingNet, feed = s.feedGapNet;
    const verdict = Math.abs(gap) < 0.01 && Math.abs(feed) < 0.01 ? 'Everything disccardpromos lists is stored here, and its balances agree with its charge list.'
      : [Math.abs(gap) >= 0.01 ? `<strong>${m(gap)}</strong> of charges that disccardpromos lists are NOT stored here (${s.missingCount} charge${s.missingCount === 1 ? '' : 's'}) — click Sync All Now; if they come back, look at the rows below.` : '',
         Math.abs(feed) >= 0.01 ? `<strong>${m(feed)}</strong> of spend reduced customers' balances on disccardpromos but is NOT in the charge list it sends (${s.feedGapCustomers} customer${s.feedGapCustomers === 1 ? '' : 's'}) — nothing synced from the charge list can ever include it.` : '',
         s.malformedCount ? `${s.malformedCount} charge entr${s.malformedCount === 1 ? 'y' : 'ies'} could not be read (no id or amount).` : ''].filter(Boolean).join('<br>');
    openModal('Spend Audit — disccardpromos vs this app', `
      <p class="small-muted">Pulled ${r.pulledCustomers} customer(s) live${r.reportedTotal != null ? ` (disccardpromos says it has ${r.reportedTotal})` : ''}. Read-only.</p>
      <div class="card" style="margin-bottom:12px"><div>${verdict}</div></div>
      <table><tbody>
        ${line('Total Spent here (Dashboard)', m(s.ourTotalSpent))}
        ${line('Net charges disccardpromos lists', m(s.providerListedNet), `${s.providerListedCount} charges across ${s.customersWithCharges} customer(s)`)}
        ${line('…of which NOT stored here', m(s.missingNet), `${s.missingCount} charge(s)`)}
        ${line('Spend implied by disccardpromos balances', m(s.balanceImpliedSpend), `committed amount minus current balance${s.customersWithoutAmount ? `; ${s.customersWithoutAmount} customer(s) report no amount` : ''}`)}
        ${line('Balance-implied spend NOT in the charge list', m(s.feedGapNet))}
        ${line('Stored here but no longer in disccardpromos\' list', m(s.storedNotInFeed), 'history of deleted / merged accounts, or charges outside what the list returns')}
      </tbody></table>
      ${r.rows.length ? `<h4 style="margin:14px 0 6px">Customers with a difference${r.totalRows > r.rows.length ? ` (top ${r.rows.length} of ${r.totalRows}; Export has all)` : ''}</h4>
      <div style="overflow-x:auto"><table><thead><tr><th>Customer</th><th>Linked to</th><th>Listed</th><th>Not stored</th><th>Balance-implied</th><th>Not in list</th></tr></thead><tbody>
        ${r.rows.map(x => `<tr><td>${esc(x.name || '—')}<div class="small-muted">#${esc(x.customerId)}${x.externalId ? ` · ext ${esc(x.externalId)}` : ''}</div></td><td>${x.linkedTo ? esc(x.linkedTo) : '<span class="small-muted">not linked</span>'}</td>
          <td>${x.listedCount} · ${m(x.listedNet)}</td><td>${x.missingCount ? `${x.missingCount} · ${m(x.missingNet)}` : '—'}${x.malformed ? `<div class="small-muted">${x.malformed} unreadable</div>` : ''}</td>
          <td>${x.balanceSpent == null ? '—' : m(x.balanceSpent)}</td><td>${x.feedGap != null && Math.abs(x.feedGap) >= 0.01 ? m(x.feedGap) : '—'}</td></tr>`).join('')}
      </tbody></table></div>` : ''}`,
      `<button class="btn btn-outline btn-sm" onclick="downloadAuthed('/cards/spend-audit?export=1', 'spend-audit.xlsx')">Export all rows (Excel)</button>`, { wide: true });
  } catch (err) { toast(err.message, true); }
  finally { btn.disabled = false; btn.textContent = 'Spend Audit'; }
});
qs('#btn-sync-all').addEventListener('click', async () => {
  const btn = qs('#btn-sync-all'); btn.disabled = true; btn.textContent = 'Syncing…';
  try { const r = await api('/cards/sync-all', { method: 'POST' }); toast(`Checked ${r.cardsChecked} card(s), synced ${r.transactionsSynced} new transaction(s)${r.cardsDiscovered ? `, found ${r.cardsDiscovered} card(s) activated directly on disccardpromos` : ''}${r.cardsRemoved ? `, deactivated ${r.cardsRemoved} card(s) removed on disccardpromos` : ''}${r.reconciliationFlags ? `, ${r.reconciliationFlags} balance mismatch(es) flagged` : ''}${r.unattributed ? `, ${r.unattributed} transaction(s) couldn't be matched to a card (counted in totals as unattributed spend)` : ''}${r.unlinkedTransactions ? `, recorded ${r.unlinkedTransactions} new charge(s) from ${r.unlinkedCustomers} disccardpromos customer(s) not linked to any applicant (counted in totals — link them under Applicants > Disccardpromos Sync)` : ''}${(r.malformed || r.unlinkedMalformed) ? `, ${(r.malformed || 0) + (r.unlinkedMalformed || 0)} malformed transaction(s) skipped (they have no id or amount — run Spend Audit)` : ''}${r.failed ? `, ${r.failed} applicant(s) FAILED to sync` : ''}${r.indexPullsFailed ? `, ${r.indexPullsFailed} season customer-list pull(s) FAILED (fell back to per-applicant reads)` : ''}`, !!(r.failed || r.indexPullsFailed)); loadCards(); loadReconFlags(); }
  catch (err) { toast(err.message, true); }
  finally { btn.disabled = false; btn.textContent = 'Sync All Now'; }
});
qs('#btn-export-txns').addEventListener('click', () => downloadAuthed('/cards/transactions/export', 'transactions.xlsx'));

async function loadCards() {
  const params = new URLSearchParams(Object.fromEntries(Object.entries(state).filter(([,v]) => v !== '')));
  try {
    const { cards, total, mockMode } = await api('/cards?' + params);
    qs('#mock-banner').innerHTML = mockMode ? `<div class="card" style="border-color:var(--warn);margin-bottom:16px"><strong>Mock mode:</strong> disccardpromos.com API keys are not configured yet, so card numbers/transactions are simulated placeholders. Set <code>DISCCARDPROMOS_API_BASE</code> and <code>DISCCARDPROMOS_API_KEY</code> to go live.</div>` : '';
    qs('#tbody-cards').innerHTML = cards.length ? cards.map(c => `<tr>
        <td>${esc(c.first_name)} ${esc(c.last_name)}</td><td>${esc(c.shul_name||'')}</td><td>${esc(c.card_number_masked||'')}</td>
        <td>${badge(c.status,c.status)}</td><td>${fmtMoney(c.amount)}</td><td>${c.activated_at?fmtDateTime(c.activated_at):''}</td>
        <td><button class="btn btn-sm btn-outline" onclick="openCard('${c.id}')">Manage</button></td>
      </tr>`).join('') : "<tr><td colspan=\"7\" class=\"empty-state\">No cards yet. Assign cards from an approved applicant's profile.</td></tr>";
    const pages = Math.max(1, Math.ceil(total / state.pageSize));
    qs('#pager-cards').innerHTML = `<button class="btn btn-sm btn-outline" ${state.page<=1?'disabled':''} onclick="changePage(-1)">Prev</button> Page ${state.page} of ${pages} <button class="btn btn-sm btn-outline" ${state.page>=pages?'disabled':''} onclick="changePage(1)">Next</button>`;
  } catch (err) { toast(err.message, true); }
}
function changePage(d) { state.page += d; loadCards(); }
qs('#f-search').addEventListener('input', debounce(() => { state.search = qs('#f-search').value; state.page=1; loadCards(); }, 350));
qs('#f-status').addEventListener('change', () => { state.status = qs('#f-status').value; state.page=1; loadCards(); });
qs('#f-pagesize').value = state.pageSize;
qs('#f-pagesize').addEventListener('change', () => { state.pageSize = +qs('#f-pagesize').value; state.page = 1; Auth.savePageSize('cards', state.pageSize); loadCards(); });
function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }

async function loadTxns() {
  try {
    const { transactions, summary } = await api('/cards/transactions/all?page=' + txnPage);
    if (summary) {
      qs('#txn-summary').innerHTML = `
        <div class="flex-between" style="flex-wrap:wrap;gap:10px"><div><strong style="font-size:18px">Total spent: ${fmtMoney(summary.totalSpent)}</strong>
          <div class="small-muted">Purchases on cards ${fmtMoney(summary.purchases)} &minus; refunds ${fmtMoney(summary.refunds)} + unattributed spend ${fmtMoney(summary.unattributedNet)}</div></div></div>
        <div class="divider" style="margin:10px 0"></div>
        <div><strong>Unattributed spend &mdash; INCLUDED in Total spent above:</strong> ${fmtMoney(summary.unattributedNet)}
          <span class="small-muted">(${summary.unattributedCount} charge(s)${summary.unlinkedCustomers ? ` from ${summary.unlinkedCustomers} disccardpromos customer(s) not linked to any applicant` : ''}). These are charges disccardpromos has but that belong to no card of ours; link those customers under Applicants &gt; Disccardpromos Sync to attach them to a person.</span></div>`;
    }
    qs('#tbody-txns').innerHTML = transactions.length ? transactions.map(t => {
      const person = t.first_name || t.last_name ? `${esc(t.first_name || '')} ${esc(t.last_name || '')}`
        : (t.unattributed ? `${esc(t.customer_name || 'Unknown customer')} <span class="small-muted">(disccardpromos customer #${esc(t.customer_id || '?')}, not linked here)</span>` : '');
      return `<tr>
        <td>${fmtDateTime(t.occurred_at)}</td><td>${person}</td><td>${esc(t.card_number_masked||'')}</td>
        <td>${badge(t.type,t.type)}</td><td>${fmtMoney(t.amount)}</td><td>${esc(t.store_name||'')}</td>
      </tr>`;
    }).join('') : '<tr><td colspan="6" class="empty-state">No transactions yet.</td></tr>';
  } catch (err) { toast(err.message, true); }
}

async function loadByShul() {
  try {
    const { shuls, unattributed } = await api('/cards/by-shul');
    const unlinkedRow = unattributed && unattributed.spent ? `<tr><td><em>Not linked to any applicant</em> <span class="small-muted">(disccardpromos customers not linked here)</span></td><td></td><td>${fmtMoney(unattributed.spent)}</td><td></td><td></td></tr>` : '';
    qs('#tbody-byshul').innerHTML = shuls.length || unlinkedRow ? shuls.map(s => {
      const pct = s.allocated > 0 ? Math.min(100, Math.round((s.spent / s.allocated) * 100)) : 0;
      return `<tr>
        <td>${esc(s.shul_name)}</td><td>${fmtMoney(s.allocated)}</td><td>${fmtMoney(s.spent)}</td><td>${fmtMoney(s.remaining)}</td>
        <td style="min-width:120px"><div style="background:var(--border);border-radius:4px;height:8px;overflow:hidden"><div style="width:${pct}%;background:var(--brand-gold-dark);height:100%"></div></div><span class="small-muted">${pct}%</span></td>
      </tr>`;
    }).join('') + unlinkedRow : '<tr><td colspan="5" class="empty-state">No cards loaded yet.</td></tr>';
  } catch (err) { toast(err.message, true); }
}

async function openCard(id) {
  try {
    const { card, transactions } = await api(`/cards/${id}`);
    const body = `
      <div class="grid-2">
        <div><strong>Applicant</strong><br>${esc(card.first_name)} ${esc(card.last_name)}</div>
        <div><strong>Status</strong><br>${badge(card.status,card.status)}</div>
      </div>
      <div class="divider"></div>
      <div class="grid-2">
        <div><strong>Card Number</strong><br>${esc(card.card_number_masked||'')}</div>
        <div><strong>Amount</strong><br>${fmtMoney(card.amount)}</div>
      </div>
      ${card.status === 'assigned' ? `<div class="divider"></div><label>Activation Phone <span class="small-muted">(defaults to the applicant's phone on file — change it if they want to activate with a different number)</span></label><input id="act-phone" placeholder="(555) 555-5555" value="${esc(card.husband_cell || card.wife_cell || card.home_phone || '')}">` : ''}
      <div class="divider"></div>
      <h4>Transaction History</h4>
      ${transactions.length ? `<table><thead><tr><th>Date</th><th>Type</th><th>Amount</th><th>Store</th></tr></thead><tbody>${transactions.map(t=>`<tr><td>${fmtDateTime(t.occurred_at)}</td><td>${badge(t.type,t.type)}</td><td>${fmtMoney(t.amount)}</td><td>${esc(t.store_name||'')}</td></tr>`).join('')}</tbody></table>` : '<p class="small-muted">No transactions synced yet.</p>'}
    `;
    const footer = `
      <button class="btn btn-outline btn-sm" onclick="syncCard('${id}')">Sync Now</button>
      ${card.status === 'assigned' ? `<button class="btn btn-primary btn-sm" onclick="activateCard('${id}')">Activate</button>` : ''}
      ${card.status !== 'deactivated' ? `<button class="btn btn-danger btn-sm" onclick="deactivateCard('${id}')">Deactivate</button>` : ''}
    `;
    openModal('Card Details', body, footer);
  } catch (err) { toast(err.message, true); }
}
window.syncCard = async (id) => { try { const r = await api(`/cards/${id}/sync`, { method: 'POST' }); toast(`Synced ${r.synced} transaction(s)`); closeModal(); openCard(id); } catch (err) { toast(err.message, true); } };
window.activateCard = async (id) => {
  const phone = qs('#act-phone').value.trim();
  if (!phone) return toast('Enter the phone number to activate with', true);
  try { await api(`/cards/${id}/activate`, { method: 'POST', body: { phone } }); toast('Card activated'); closeModal(); loadCards(); } catch (err) { toast(err.message, true); }
};
window.deactivateCard = async (id) => { if (!confirm('Deactivate this card?')) return; try { await api(`/cards/${id}/deactivate`, { method: 'POST' }); closeModal(); loadCards(); } catch (err) { toast(err.message, true); } };

loadCards();
const preselect = new URLSearchParams(location.search).get('card');
if (preselect) openCard(preselect);
</script>
</body>
</html>
