<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Payments · Kupes Hair Williamsburg</title>
<link rel="stylesheet" href="/css/theme.css">
<link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="stylesheet" href="/css/portal-theme.css">
</head>
<body>
<script src="/js/app.js"></script>
<!-- Loaded here, before the inline script below runs, so setAccount()/
     getTokens() (called from loadPayForm()/submitPayment()) are already
     defined by the time they're needed — a tag placed at the very end of
     the body (where Stripe.js used to sit on this page) executes too late
     for that, since loadPayForm() runs synchronously in the IIFE at the
     bottom of the inline block below, well before the page finishes
     parsing. -->
<script src="https://cdn.cardknox.com/ifields/3.5.2607.1401/ifields.min.js"></script>
<script>
Auth.requireRole('shul');
renderShell('/shul-portal/payments', `
  <h2>Payments</h2>
  <div class="stat-grid" id="balance-stats"><div class="small-muted">Loading…</div></div>

  <div class="card" style="margin-top:16px">
    <h3 style="margin-top:0">Add Funds Calculator</h3>
    <p class="small-muted">Type an amount into "Add Funds" on any applicant below (in the table further down) to see it reflected here before you activate it.</p>
    <div class="stat-grid" id="calc-stats"></div>
    <button class="btn btn-primary btn-sm" style="margin-top:10px" onclick="promptPay()">Pay</button>
  </div>

  <div class="card" style="margin-top:16px">
    <h3 style="margin-top:0">Make a Payment</h3>
    <div id="sola-disabled-note" style="display:none" class="small-muted">Online card payment isn't available for your shul right now.</div>
    <div id="sola-mock-note" style="display:none" class="small-muted">Test mode — no real charge will be made.</div>
    <div id="sola-form-wrap" style="display:none">
      <label>Amount ($)</label><input id="pay-amount" type="number" min="1" step="0.01" style="max-width:220px">
      <div class="grid-2" style="margin-top:14px;max-width:420px">
        <div>
          <label>Card Number</label>
          <iframe data-ifields-id="card-number" data-ifields-placeholder="Card Number" src="https://cdn.cardknox.com/ifields/3.5.2607.1401/ifield.htm" style="width:100%;height:38px;border:1px solid var(--border);border-radius:6px"></iframe>
        </div>
        <div>
          <label>CVV</label>
          <iframe data-ifields-id="cvv" data-ifields-placeholder="CVV" src="https://cdn.cardknox.com/ifields/3.5.2607.1401/ifield.htm" style="width:100%;height:38px;border:1px solid var(--border);border-radius:6px"></iframe>
        </div>
      </div>
      <form id="sola-pay-form" style="display:none">
        <input name="xCardNum" type="hidden" data-ifields-id="card-number-token">
        <input name="xCVV" type="hidden" data-ifields-id="cvv-token">
      </form>
      <label data-ifields-id="card-data-error" style="color:var(--danger,#b91c1c);display:block;margin-top:6px"></label>
      <button class="btn btn-primary btn-sm" style="margin-top:14px" id="btn-pay" onclick="submitPayment()">Pay</button>
      <div id="pay-status" class="small-muted" style="margin-top:8px"></div>
    </div>
    <button class="btn btn-outline btn-sm" style="margin-top:10px" onclick="openRequestMethodModal()">Request a Different Payment Method</button>
  </div>

  <h3 style="margin-top:20px">Give to an Applicant</h3>
  <p class="small-muted">Funded from your Approved Balance. You can add more to an applicant who already received money this season, but you can't take back what's already been given.</p>
  <div class="card" style="padding:0;overflow-x:auto"><table><thead><tr><th>Applicant</th><th>Given</th><th>Matched</th><th>Total</th><th>Add Funds</th><th></th></tr></thead>
    <tbody id="give-tbody"><tr><td colspan="6" class="empty-state">Loading…</td></tr></tbody></table></div>

  <h3 style="margin-top:20px">Payment History</h3>
  <div class="card" style="padding:0;overflow-x:auto"><table><thead><tr><th>Type</th><th>Method</th><th>Amount</th><th>Status</th><th>Date</th></tr></thead>
    <tbody id="payments-tbody"><tr><td colspan="5" class="empty-state">Loading…</td></tr></tbody></table></div>
`);

let payConfig = null, ifieldsReady = false;
let approvedBalance = 0;

async function loadBalance() {
  const b = await api('/shul-payments/mine/balance');
  approvedBalance = b.approved;
  qs('#balance-stats').innerHTML = `
    <div class="card"><div class="small-muted">Pending Approval</div><div style="font-size:22px;font-weight:600">${fmtMoney(b.pending)}</div></div>
    <div class="card"><div class="small-muted">Approved (available to give)</div><div style="font-size:22px;font-weight:600">${fmtMoney(b.approved)}</div></div>
  `;
  updateCalculator();
}

// Live running total of every not-yet-activated "Add Funds" textbox in the
// Give-to-an-Applicant table below, plus what's still needed once that's
// weighed against the Approved Balance actually on file — a shul typing
// amounts into several applicants at once sees, before committing to
// anything, whether what they're about to give is fully covered.
//
// "Needed" means additional money beyond the approved balance — money
// already paid in and sitting in that balance is covered, not still
// needed, so this is only ever the SHORTFALL (typed amounts minus what's
// available), clamped at $0 once the balance covers everything typed in.
// This used to be `approvedBalance - notActivated`, which — with nothing
// typed into any box yet (notActivated=0) — showed the shul's entire
// available balance as "Total Needed", as if money they'd already paid in
// still needed to be paid.
function updateCalculator() {
  const notActivated = qsa('.give-amount-input').reduce((sum, el) => sum + (+el.value || 0), 0);
  const needed = Math.max(0, notActivated - approvedBalance);
  qs('#calc-stats').innerHTML = `
    <div class="card"><div class="small-muted">Available Balance</div><div style="font-size:20px;font-weight:600">${fmtMoney(approvedBalance)}</div></div>
    <div class="card"><div class="small-muted">Total Not Activated</div><div style="font-size:20px;font-weight:600">${fmtMoney(notActivated)}</div></div>
    <div class="card"><div class="small-muted">Total Needed</div><div style="font-size:20px;font-weight:600${needed > 0 ? ';color:var(--danger,#b91c1c)' : ''}">${fmtMoney(needed)}</div></div>
  `;
}

async function loadPayForm() {
  payConfig = await api('/shul-payments/mine/config');
  if (!payConfig.solaEnabled) { qs('#sola-disabled-note').style.display = 'block'; return; }
  if (payConfig.mockMode) qs('#sola-mock-note').style.display = 'block';
  if (!payConfig.ifieldsKey && !payConfig.mockMode) { qs('#sola-disabled-note').textContent = 'Payment is not fully configured yet — contact the office.'; qs('#sola-disabled-note').style.display = 'block'; return; }
  qs('#sola-form-wrap').style.display = 'block';
  // Mock mode never talks to Sola's real iframes (there's nothing live to
  // tokenize against), so it skips setAccount() entirely — submitPayment()
  // below checks payConfig.mockMode before ever calling getTokens().
  if (!payConfig.mockMode && window.setAccount) {
    setAccount(payConfig.ifieldsKey, 'EverythingShul-eCards', '1.0');
    ifieldsReady = true;
  }
}

window.submitPayment = async () => {
  const amount = +qs('#pay-amount').value;
  if (!(amount > 0)) { qs('#pay-status').textContent = 'Enter a valid amount'; return; }
  qs('#btn-pay').disabled = true;
  qs('#pay-status').textContent = '';
  const charge = async (xCardNum, xCVV) => {
    try {
      const { mock } = await api('/shul-payments/mine/sola-charge', { method: 'POST', body: { amount, xCardNum, xCVV } });
      qs('#pay-status').textContent = mock
        ? 'Test mode: charge simulated. (No real Sola account configured — nothing further to confirm.)'
        : 'Payment submitted — it will show as pending until the office approves it.';
      loadBalance(); loadPayments();
    } catch (err) { qs('#pay-status').textContent = err.message; }
    qs('#btn-pay').disabled = false;
  };
  if (payConfig.mockMode || !ifieldsReady) { await charge(null, null); return; }
  // getTokens() (from Sola's ifields.min.js) hands card-number/CVV single-
  // use tokens to the hidden xCardNum/xCVV inputs in #sola-pay-form — real
  // card data never touches this page's own JS at any point, see
  // services/sola.js for the full reasoning.
  getTokens(
    () => { charge(document.querySelector('input[name=xCardNum]').value, document.querySelector('input[name=xCVV]').value); },
    () => { qs('#pay-status').textContent = 'Could not read card details — please try again.'; qs('#btn-pay').disabled = false; },
    30000,
  );
};
// The calculator's own Pay button used to prompt for just an amount and
// charge immediately — that worked when the "amount" was all a charge
// needed, but a real card charge now needs interactive card-number/CVV
// entry in the iframes below, which a JS prompt() can't provide. This now
// fills in the amount and points the shul at the actual form instead of
// charging blind.
window.promptPay = () => {
  const raw = prompt('Amount to pay ($):', '');
  if (raw === null) return;
  const amount = +raw;
  if (!(amount > 0)) return toast('Enter a valid amount', true);
  if (!qs('#sola-form-wrap') || qs('#sola-form-wrap').style.display === 'none') return toast('Online card payment is not enabled for your shul.', true);
  qs('#pay-amount').value = amount;
  qs('#sola-form-wrap').scrollIntoView({ behavior: 'smooth', block: 'center' });
  toast(`Enter your card details below and click Pay to charge ${fmtMoney(amount)}.`);
};

window.openRequestMethodModal = () => {
  const body = `
    <label>Requested Method</label>
    <select id="rm-method"><option value="wire">Wire Transfer</option><option value="quickpay">Quick Pay</option><option value="check">Check</option><option value="cash">Cash</option><option value="other">Other</option></select>
    <label>Message (optional)</label><textarea id="rm-message" rows="3"></textarea>
  `;
  openModal('Request a Different Payment Method', body, `<button class="btn btn-primary btn-sm" onclick="submitMethodRequest()">Send Request</button>`);
};
window.submitMethodRequest = async () => {
  try {
    await api('/shul-payments/mine/request-method', { method: 'POST', body: { requested_method: qs('#rm-method').value, message: qs('#rm-message').value } });
    toast('Request sent — the office will follow up with you.');
    closeModal();
  } catch (err) { toast(err.message, true); }
};

// One row per approved applicant (the full list, not a dropdown — a shul
// can see and act on every one of them at once) with their running given/
// matched/total for this season plus an Add Funds box + Activate button.
// An applicant with nothing given yet still shows up, at $0/$0/$0, so a
// shul can give to them for the first time from the same table.
async function loadGiveTable() {
  const [{ applicants }, { allocations }] = await Promise.all([
    api('/applicants?status=approved&pageSize=500'),
    api('/shul-payments/mine/allocations'),
  ]);
  const approved = applicants.filter(a => a.approval_status === 'approved');
  const totals = new Map(); // applicant_id -> { given, matched }
  for (const a of allocations) {
    if (a.reversed) continue;
    const t = totals.get(a.applicant_id) || { given: 0, matched: 0 };
    t.given += a.base_amount;
    t.matched += a.display_total - a.base_amount;
    totals.set(a.applicant_id, t);
  }
  qs('#give-tbody').innerHTML = approved.length ? approved.map(a => {
    const t = totals.get(a.id) || { given: 0, matched: 0 };
    return `<tr>
      <td>${esc(a.first_name)} ${esc(a.last_name)}</td>
      <td>${fmtMoney(t.given)}</td>
      <td>${fmtMoney(t.matched)}</td>
      <td>${fmtMoney(t.given + t.matched)}</td>
      <td><input type="number" min="0.01" step="0.01" class="give-amount-input" data-applicant="${a.id}" placeholder="Add funds" style="max-width:130px"></td>
      <td><button class="btn btn-primary btn-sm" onclick="activateFunds('${a.id}')">Activate</button></td>
    </tr>`;
  }).join('') : '<tr><td colspan="6" class="empty-state">No approved applicants yet.</td></tr>';
  qsa('.give-amount-input').forEach(el => el.addEventListener('input', updateCalculator));
  updateCalculator();
}
window.activateFunds = async (applicantId) => {
  if (!(approvedBalance > 0)) return toast("You don't have any approved balance to give right now.", true);
  const input = qs(`.give-amount-input[data-applicant="${applicantId}"]`);
  const amount = +input.value;
  if (!(amount > 0)) return toast('Enter an amount to add first', true);
  try {
    // Same allocation path as ever — funded from the shul's approved
    // balance and loaded onto the applicant's card exactly like any other
    // card load, additive to whatever they already have.
    await api('/shul-payments/mine/allocate', { method: 'POST', body: { applicant_id: applicantId, amount } });
    toast('Activated');
    loadBalance(); loadGiveTable();
  } catch (err) { toast(err.message, true); }
};

const MANUAL_METHOD_LABEL = { wire: 'Wire Transfer', quickpay: 'Quick Pay', check: 'Check', cash: 'Cash', other: 'Other', stripe_card: 'Card', sola_card: 'Card', sola_refund: 'Refund' };
async function loadPayments() {
  const { payments } = await api('/shul-payments/mine');
  qs('#payments-tbody').innerHTML = payments.length ? payments.map(p => `<tr>
      <td>${p.direction === 'out' ? badge('Paid to You', 'active') : badge('You Paid', 'pending')}</td>
      <td>${MANUAL_METHOD_LABEL[p.method] || p.method}</td><td>${p.direction === 'out' ? '-' : ''}${fmtMoney(Math.abs(p.net_amount))}</td>
      <td>${badge(p.status, p.status === 'approved' ? 'active' : (p.status === 'rejected' ? 'rejected' : 'pending'))}</td>
      <td>${fmtDateTime(p.created_at)}</td>
    </tr>`).join('') : '<tr><td colspan="5" class="empty-state">No payments yet.</td></tr>';
}

(async () => {
  loadBalance();
  loadPayForm();
  loadGiveTable();
  loadPayments();
})();
</script>
</body>
</html>
