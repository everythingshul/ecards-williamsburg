services:
  - type: web
    name: ecards-kupeshair
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: node src/index.js
    disk:
      name: ecards-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /data
      - key: APP_URL
        value: https://ecards.kupeshair.org
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_DEFAULT_SENDER
        sync: false
      - key: EMAIL_DEFAULT_SENDER_NAME
        sync: false
      - key: ORG_NAME
        value: Kupes Hair Williamsburg
      - key: SUPPORT_EMAIL
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: DISCCARDPROMOS_API_BASE
        sync: false
      - key: DISCCARDPROMOS_API_KEY
        sync: false
      - key: SMS_API_BASE
        sync: false
      - key: SMS_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # Sola Payments (services/sola.js) — replaces Stripe above for shul
      # card payments; the STRIPE_* vars above are no longer read by the
      # app but are left here since historical shul_payments rows still
      # reference method='stripe_card'. Card data is collected in a plain
      # (non-iframe) form and forwarded straight to Sola's API — see
      # sola.js's file-level comment for the PCI-scope tradeoff behind that
      # — so there's no separate public "iFields key" needed, only the
      # private transaction key below.
      - key: SOLA_TRANSACTION_KEY
        sync: false
      # Off-site backups (services/offsiteBackup.js). The nightly EMAILED
      # database copy needs nothing beyond BREVO_API_KEY above. For a
      # second, size-unlimited copy that also includes every uploaded PDF /
      # signature / logo, point these at any S3-compatible bucket
      # (Backblaze B2, Cloudflare R2, AWS S3, Wasabi…). All four of
      # BUCKET / ENDPOINT / ACCESS_KEY / SECRET_KEY must be set for the
      # channel to switch on; leave them empty and it stays off.
      #   ENDPOINT examples: https://s3.us-west-004.backblazeb2.com
      #                      https://<accountid>.r2.cloudflarestorage.com
      #                      https://s3.us-east-1.amazonaws.com
      #   REGION: the bucket's region (B2: e.g. us-west-004; R2: auto;
      #           AWS: e.g. us-east-1). Defaults to us-east-1.
      #   RETENTION_COUNT: newest copies to keep per kind (default 30).
      - key: BACKUP_S3_BUCKET
        sync: false
      - key: BACKUP_S3_ENDPOINT
        sync: false
      - key: BACKUP_S3_REGION
        sync: false
      - key: BACKUP_S3_ACCESS_KEY
        sync: false
      - key: BACKUP_S3_SECRET_KEY
        sync: false
      - key: BACKUP_S3_RETENTION_COUNT
        sync: false
